limit_req_zone $binary_remote_addr zone=notification_reads:1m rate=2r/s;

server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  resolver 127.0.0.11 valid=5s ipv6=off;
  set $gateway gateway:8080;

  client_max_body_size 1m;

  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self';" always;

  location /api/v1/admin/events/stream {
    proxy_pass http://$gateway$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 60s;
  }

  location /swagger {
    proxy_pass http://$gateway$request_uri;
    proxy_set_header Host $host;
  }

  location /broker-swagger {
    proxy_pass http://$gateway$request_uri;
    proxy_set_header Host $host;
  }

  location /api/openapi.yaml {
    proxy_pass http://$gateway$request_uri;
    proxy_set_header Host $host;
  }

  location /api/broker-openapi.yaml {
    proxy_pass http://$gateway$request_uri;
    proxy_set_header Host $host;
  }

  # Bound expensive inbox reads even from a tab running an older frontend.
  location = /api/v1/admin/notifications {
    limit_req zone=notification_reads burst=2 nodelay;
    limit_req_status 429;
    proxy_pass http://$gateway$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 10s;
  }

  location /api/ {
    proxy_pass http://$gateway$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  location /health {
    proxy_pass http://$gateway$request_uri;
  }

  location /ready {
    proxy_pass http://$gateway$request_uri;
  }

  location / {
    try_files $uri /index.html;
  }
}
