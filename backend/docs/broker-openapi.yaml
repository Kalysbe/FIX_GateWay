openapi: 3.0.3
info:
  title: Кыргыз Фондулук Биржасы — Broker API
  version: 1.0.0
  description: |
    REST API для брокеров Кыргызской Фондовой Биржи.

    Авторизация: `Authorization: Bearer <API-токен>`. Токен выдаёт оператор биржи.

    Формат ответа: `{"success", "code", "message", "error_code", "data"}`; у списков — ещё `has_more` и `next_offset`.
    Коды ошибок — `GET /api/v1/errors`.
  contact:
    name: KSE Gateway Support
servers:
  - url: http://localhost:8080
    description: Local development
tags:
  - name: Проверка связи
  - name: Токен
  - name: Справочники
  - name: Заявки
  - name: Сделки
  - name: Позиции
  - name: Рыночные данные
paths:
  /health:
    get:
      tags: [Проверка связи]
      summary: Liveness
      responses:
        "200":
          description: OK
  /api/v1/token:
    get:
      tags: [Токен]
      summary: Информация о токене
      security:
        - bearerAuth: []
      description: |
        Доступен любому действующему токену. `token` — параметры токена, `broker` — брокер,
        `firm` — строка QUIK `Firms` фирмы токена (`null`, если в `Firms` её нет).
      responses:
        "200":
          description: Токен, брокер и фирма
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: object
                    properties:
                      id: {type: string, format: uuid}
                      name: {type: string}
                      description: {type: string}
                      token_prefix: {type: string}
                      status: {type: string, enum: [ACTIVE]}
                      permissions: {type: array, items: {type: string}}
                      firm_id: {type: string, description: "Фирма заявок (FIX 5018)"}
                      expires_at: {type: string, format: date-time, nullable: true}
                      created_at: {type: string, format: date-time}
                      last_used_at: {type: string, format: date-time, nullable: true}
                  broker:
                    type: object
                    properties:
                      code: {type: string}
                      name: {type: string}
                      status: {type: string, enum: [ACTIVE]}
                  firm:
                    allOf: [{$ref: "#/components/schemas/QuikFirmRow"}]
                    nullable: true
              example:
                token:
                  id: 3f0c2a5e-6b1d-4c8e-9a7f-2d4b6e8f1a3c
                  name: trader
                  description: ""
                  token_prefix: Xk3pQ9aL
                  status: ACTIVE
                  permissions: [orders:read, orders:create, orders:cancel]
                  firm_id: "2040"
                  expires_at: null
                  created_at: "2026-10-20T09:15:00Z"
                  last_used_at: "2026-11-03T04:02:11Z"
                broker: {code: SENTI, name: Сенти, status: ACTIVE}
                firm: {Exchange: KSE, FirmId: "2040", FirmName: Сенти, Status: null, StatusFlag: 1}
        "401":
          description: Unauthorized
        "503":
          description: QUIK недоступен
  /api/v1/errors:
    get:
      tags: [Справочники]
      summary: Коды ошибок
      security:
        - bearerAuth: []
      description: |
        `codes` — значения поля `code`. `error_codes` — значения поля `error_code` (коды отказа QUIK):
        `operation` = `order` — отказ заявки, `cancel` — отказ снятия.
      responses:
        "200":
          description: Справочник кодов
          content:
            application/json:
              schema:
                type: object
                properties:
                  codes:
                    type: array
                    items:
                      type: object
                      properties:
                        code: {type: string}
                        http_status: {type: integer}
                        description: {type: string}
                  error_codes:
                    type: array
                    items:
                      type: object
                      properties:
                        error_code: {type: integer}
                        operation: {type: string, enum: [order, cancel]}
                        source: {type: string}
                        description: {type: string}
              example:
                codes:
                  - {code: ORDER_REJECTED, http_status: 422, description: "QUIK отклонил заявку; причина — message и error_code"}
                error_codes:
                  - {error_code: 8637225, operation: order, source: "Дилерская библиотека QUIK (проверка лимитов и прав)", description: "Работа по данному торговому счёту запрещена"}
        "401":
          description: Unauthorized
  /api/v1/instruments:
    get:
      tags: [Справочники]
      summary: Инструменты
      security:
        - bearerAuth: []
      description: Требует `orders:read`. Строки QUIK `Securities`.
      parameters:
        - {in: query, name: limit, schema: {type: integer, minimum: 1, maximum: 1000, default: 200}}
        - {in: query, name: offset, schema: {type: integer, minimum: 0, maximum: 10000000, default: 0}}
      responses:
        "200":
          description: Строки Securities
          headers:
            X-Has-More: {schema: {type: boolean}}
            X-Next-Offset: {schema: {type: integer}}
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Instrument"
        "401":
          description: Unauthorized
        "503":
          description: QUIK недоступен
  /api/v1/market-data:
    get:
      tags: [Рыночные данные]
      summary: Текущие торги
      security:
        - bearerAuth: []
      description: Требует `orders:read`. Инструменты за сегодня; поля — в схеме `MarketDataRow`.
      parameters:
        - in: query
          name: board
          schema: {type: string}
          description: ClassCode
        - in: query
          name: symbol
          schema: {type: string}
          description: SecCode
        - {in: query, name: limit, schema: {type: integer, minimum: 1, maximum: 5000, default: 1000}}
        - {in: query, name: offset, schema: {type: integer, minimum: 0, maximum: 10000000, default: 0}}
      responses:
        "200":
          description: Инструменты текущих торгов
          headers:
            X-Has-More: {schema: {type: boolean}}
            X-Next-Offset: {schema: {type: integer}}
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MarketDataRow"
              example:
                - {ClassCode: LIST_GBA, SecCode: GBA02270915, CouponValue: 2.5, status: торгуется, FaceUnit: KGS, SecShortName: "ГКО-2 летние (GBA02270915)", SecFullName: "ГКО-2 летние (GBA02270915)", ClassName: "Листинговые:облигации", lotsize: 1, tradingstatus: открыта, pricemin: 86, pricemax: 100, realminstep: null, bid: 100, biddepth: 16, offer: null, offerdepth: null, last: 95, qty: 15, time: "1900-01-01T16:40:15", open: null, high: 100, low: 95, prevprice: 95, waprice: 95.4, numtrades: 3, voltoday: 125, valtoday: 11925, accruedint: null, yield: 16.92, nextcoupon: "2027-01-31T00:00:00", couponperiod: 184}
        "400":
          description: Неверные limit/offset
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "429":
          description: Rate limited
        "503":
          description: QUIK недоступен
  /api/v1/market-data/{board}/{symbol}:
    get:
      tags: [Рыночные данные]
      summary: Инструмент текущих торгов
      security:
        - bearerAuth: []
      description: Требует `orders:read`.
      parameters:
        - {in: path, name: board, required: true, schema: {type: string}, description: ClassCode}
        - {in: path, name: symbol, required: true, schema: {type: string}, description: SecCode}
      responses:
        "200":
          description: Инструмент
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketDataRow"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Инструмент не найден
        "503":
          description: QUIK недоступен
  /api/v1/market-data/trades:
    get:
      tags: [Рыночные данные]
      summary: Сделки рынка для графика цен
      security:
        - bearerAuth: []
      description: |
        Требует `orders:read`. Исполненные сделки КФБ всех участников из QUIK `Trades`, по одной строке на сделку,
        в хронологическом порядке (`TradeDateTime`, затем `TradeNum`). Участники не раскрываются.

        - `TradeNum` + `ClassCode` — идентификатор сделки;
        - `TradeDateTime` и `CanceledDateTime` — время КФБ с часовым поясом (+06:00);
        - `Price` — цена за единицу без комиссий, `SettleCurrency` — валюта расчётов;
        - `Kind` — вид сделки (`Обычная`, `Адресная сделка первой части РЕПО` и др.);
        - `CanceledDateTime` — `null`, если сделка не отменена.

        Обновление: повторяйте запрос с `from` = `TradeDateTime` последней полученной сделки и отбрасывайте
        уже полученные `TradeNum` + `ClassCode`. История — с 01.07.2026.
      parameters:
        - {in: query, name: board, schema: {type: string}, description: ClassCode}
        - {in: query, name: symbol, schema: {type: string}, description: SecCode}
        - {in: query, name: from, schema: {type: string}, description: "Начало периода включительно: ГГГГ-ММ-ДД (день КФБ) или RFC 3339"}
        - {in: query, name: to, schema: {type: string}, description: "Конец периода включительно: ГГГГ-ММ-ДД (весь день КФБ) или RFC 3339"}
        - {in: query, name: limit, schema: {type: integer, minimum: 1, maximum: 1000, default: 200}}
        - {in: query, name: offset, schema: {type: integer, minimum: 0, maximum: 10000000, default: 0}}
      responses:
        "200":
          description: Сделки
          headers:
            X-Has-More: {schema: {type: boolean}}
            X-Next-Offset: {schema: {type: integer}}
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MarketTrade"
        "400":
          description: Неверный from, to, limit или offset; from позже to
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "503":
          description: QUIK недоступен
  /api/v1/quotes:
    get:
      tags: [Рыночные данные]
      summary: Котировки инструмента
      security:
        - bearerAuth: []
      description: Требует `orders:read`. Активные заявки рынка за сегодня, от новых к старым.
      parameters:
        - {in: query, name: board, required: true, schema: {type: string}, description: ClassCode, example: LIST_GBA}
        - {in: query, name: symbol, required: true, schema: {type: string}, description: SecCode, example: GBA02270915}
        - {in: query, name: limit, schema: {type: integer, minimum: 1, maximum: 1000, default: 200}}
        - {in: query, name: offset, schema: {type: integer, minimum: 0, maximum: 10000000, default: 0}}
      responses:
        "200":
          description: Котировки
          headers:
            X-Has-More: {schema: {type: boolean}}
            X-Next-Offset: {schema: {type: integer}}
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [side, price, quantity, volume]
                  additionalProperties: false
                  properties:
                    side: {type: string, enum: [BUY, SELL], nullable: true}
                    price: {type: number, nullable: true}
                    quantity: {type: number, nullable: true, description: Остаток}
                    volume: {type: number, nullable: true, description: price × quantity}
              example:
                - {side: BUY, price: 100, quantity: 10, volume: 1000}
                - {side: SELL, price: 100.5, quantity: 4, volume: 402}
        "400":
          description: Не указаны board и symbol, неверный limit или offset
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "429":
          description: Rate limited
        "503":
          description: QUIK недоступен
  /api/v1/orderbook:
    get:
      tags: [Справочники]
      summary: Стакан
      security:
        - bearerAuth: []
      description: Требует `orders:read`. `bids` — спрос, `offers` — предложение, лучшая цена первой.
      parameters:
        - in: query
          name: symbol
          schema:
            type: string
          description: SecCode
        - in: query
          name: board
          schema:
            type: string
          description: ClassCode
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderBookResponse"
              example:
                source: live
                live: true
                books:
                  - symbol: GBA02280810
                    security_id: GBA02280810
                    board: LIST_GBA
                    currency: KGS
                    bid: "99.5"
                    bid_size: "10"
                    offer: "100.5"
                    offer_size: "12"
                    bids:
                      - price: "99.5"
                        size: "10"
                    offers:
                      - price: "100.5"
                        size: "12"
        "401":
          description: Unauthorized
  /api/v1/accounts:
    get:
      tags: [Справочники]
      summary: Торговые счета фирмы
      security:
        - bearerAuth: []
      description: Требует `orders:read`. Строки QUIK `Trdaccs`. `TrdAccId` передаётся в `Account` заявки.
      responses:
        "200":
          description: Строки Trdaccs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/QuikTradingAccountRow"
        "401":
          description: Unauthorized
        "503":
          description: QUIK недоступен
  /api/v1/orders:
    post:
      tags: [Заявки]
      summary: Создать заявку
      security:
        - bearerAuth: []
      description: |
        Требует `orders:create`. С `Price` — лимитная, без `Price` — рыночная. Срок — день.

        - `201` — QUIK принял заявку;
        - `202` `QUIK_ANSWER_PENDING` — QUIK не ответил за 10 с, итог — `GET /api/v1/orders/{id}`;
        - `422` `ORDER_REJECTED` — QUIK отклонил заявку;
        - `502` `ORDER_FAILED` — заявка не передана в QUIK.

        Каждый запрос создаёт новую заявку. Перед повтором после сетевой ошибки проверьте `GET /api/v1/orders`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderRequest"
            example:
              ClassCode: "LIST_GBA"
              SecCode: "GBA02270915"
              Operation: "Купля"
              Price: 99.5
              Qty: 1
              Account: "1-3101-006"
              ClientCode: "006"
      responses:
        "201":
          description: QUIK принял заявку
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
              example:
                OrderNum: 26102912345
                State: "Активна"
                ClassCode: "LIST_GBA"
                SecCode: "GBA02270915"
                Operation: "Купля"
                Price: 99.5
                Qty: 1
                Balance: 1
                Account: "1-3101-006"
                ClientCode: "006"
                FirmId: "SENTI2004"
                RejectReason: null
                id: "276d043c-6716-4ebd-a7b7-15904e760d40"
        "202":
          description: QUIK_ANSWER_PENDING
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "502":
          description: ORDER_FAILED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "422":
          description: ORDER_REJECTED, TRADING_PAUSED, MAX_ORDER_QUANTITY, MAX_OPEN_ORDERS
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
              example:
                code: "ORDER_REJECTED"
                error: "rejected by QUIK"
                OrderNum: null
                State: "Отклонена"
                ClassCode: "LIST_GBA"
                SecCode: "GBA02270915"
                Operation: "Купля"
                Price: 99.5
                Qty: 1
                Balance: 1
                Account: "1-3101-006"
                ClientCode: "006"
                FirmId: "SENTI2004"
                RejectReason: "Недостаточно средств"
                id: "276d043c-6716-4ebd-a7b7-15904e760d40"
        "400":
          description: Ошибка валидации
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "429":
          description: Rate limited
    get:
      tags: [Заявки]
      summary: Заявки фирмы
      security:
        - bearerAuth: []
      description: |
        Требует `orders:read`. Строки QUIK `Orders` за все даты, по убыванию `TradeDate`, затем `OrderNum`.
        `OrderNum` может иметь 19 знаков. Фильтры применяются до пагинации.
      parameters:
        - {in: query, name: date, schema: {type: string, format: date}, description: "TradeDate, ГГГГ-ММ-ДД"}
        - {in: query, name: board, schema: {type: string}, description: ClassCode}
        - {in: query, name: symbol, schema: {type: string}, description: SecCode}
        - {in: query, name: limit, schema: {type: integer, minimum: 1, maximum: 1000, default: 200}}
        - {in: query, name: offset, schema: {type: integer, minimum: 0, maximum: 10000000, default: 0}}
      responses:
        "200":
          description: Строки Orders
          headers:
            X-Has-More: {schema: {type: boolean}}
            X-Next-Offset: {schema: {type: integer}}
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/QuikOrderRow"
        "400":
          description: Неверный date, limit или offset
        "401":
          description: Unauthorized
        "503":
          description: QUIK недоступен
  /api/v1/orders/active:
    get:
      tags: [Заявки]
      summary: Активные заявки фирмы за сегодня
      security:
        - bearerAuth: []
      description: Требует `orders:read`. Фильтры применяются до пагинации.
      parameters:
        - {in: query, name: board, schema: {type: string}, description: ClassCode}
        - {in: query, name: symbol, schema: {type: string}, description: SecCode}
        - {in: query, name: limit, schema: {type: integer, minimum: 1, maximum: 1000, default: 200}}
        - {in: query, name: offset, schema: {type: integer, minimum: 0, maximum: 10000000, default: 0}}
      responses:
        "200":
          description: Строки Orders
          headers:
            X-Has-More: {schema: {type: boolean}}
            X-Next-Offset: {schema: {type: integer}}
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/QuikOrderRow"
        "400":
          description: Неверный limit или offset
        "401":
          description: Unauthorized
        "503":
          description: QUIK недоступен
  /api/v1/orders/{id}:
    get:
      tags: [Заявки]
      summary: Заявка
      security:
        - bearerAuth: []
      description: Требует `orders:read`.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: "`quik-ГГГГММДД-КЛАСС-НОМЕР` или `id` из ответа на создание (пока заявка открыта)"
      responses:
        "200":
          description: Строка Orders
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuikOrderRow"
        "400":
          description: Неверный ключ
        "401":
          description: Unauthorized
        "404":
          description: Заявка не найдена
        "503":
          description: QUIK недоступен
  /api/v1/orders/{id}/cancel:
    post:
      tags: [Заявки]
      summary: Снять заявку
      security:
        - bearerAuth: []
      description: |
        Требует `orders:cancel`. Тело не нужно.

        - `200` — заявка снята;
        - `202` `QUIK_ANSWER_PENDING` — QUIK не ответил за 10 с, итог — `GET /api/v1/orders/{id}`;
        - `409` `CANCEL_REJECTED` — QUIK не снял заявку.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: "`quik-ГГГГММДД-КЛАСС-НОМЕР` или `id` из ответа на создание"
      responses:
        "200":
          description: Заявка снята
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "202":
          description: QUIK_ANSWER_PENDING
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          description: Неверный ключ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorized
        "404":
          description: Заявка не найдена
        "409":
          description: CANCEL_REJECTED, заявка не активна или выставлена не через API
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "503":
          description: QUIK недоступен
  /api/v1/trades:
    get:
      tags: [Сделки]
      summary: Сделки фирмы
      security:
        - bearerAuth: []
      description: |
        Требует `trades:read`. Строки QUIK `Trades` за все даты, по убыванию `TradeDate`, затем `TradeNum`.
        Фильтры применяются до пагинации.
      parameters:
        - {in: query, name: date, schema: {type: string, format: date}, description: "TradeDate, ГГГГ-ММ-ДД"}
        - {in: query, name: board, schema: {type: string}, description: ClassCode}
        - {in: query, name: symbol, schema: {type: string}, description: SecCode}
        - {in: query, name: limit, schema: {type: integer, minimum: 1, maximum: 1000, default: 200}}
        - {in: query, name: offset, schema: {type: integer, minimum: 0, maximum: 10000000, default: 0}}
      responses:
        "200":
          description: Строки Trades
          headers:
            X-Has-More: {schema: {type: boolean}}
            X-Next-Offset: {schema: {type: integer}}
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Trade"
        "400":
          description: Неверный date, limit или offset
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "503":
          description: QUIK недоступен
  /api/v1/positions/moneylimits:
    get:
      tags: [Позиции]
      summary: Денежные позиции фирмы
      security:
        - bearerAuth: []
      description: |
        Требует `positions:read`. Строки QUIK `MoneyLimits` вашей фирмы за последнюю `LoadDate`
        в исходном виде. Событие gRPC `moneylimits.updated` — тот же массив в `event.data_json`.
      responses:
        "200":
          description: Строки MoneyLimits
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MoneyLimitRow"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "503":
          description: QUIK недоступен
  /api/v1/positions/depolimits:
    get:
      tags: [Позиции]
      summary: Позиции фирмы по бумагам
      security:
        - bearerAuth: []
      description: |
        Требует `positions:read`. Строки QUIK `DepoLimits` вашей фирмы за последнюю `LoadDate`
        в исходном виде. Событие gRPC `depolimits.updated` — тот же массив в `event.data_json`.
      responses:
        "200":
          description: Строки DepoLimits
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DepoLimitRow"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "503":
          description: QUIK недоступен
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API token
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
      example: {"error": "счёт \"1-3101-006\" не найден у фирмы \"FREEDOM2003\"; список счетов — GET /api/v1/accounts"}
    CreateOrderRequest:
      type: object
      required: [ClassCode, SecCode, Operation, Qty, Account, ClientCode]
      additionalProperties: false
      properties:
        ClassCode:
          type: string
          example: "LIST_GBA"
        SecCode:
          type: string
          example: "GBA02270915"
        Operation:
          type: string
          enum: ["Купля", "Продажа"]
          example: "Купля"
        Price:
          type: number
          example: 400
          description: "Без Price — рыночная заявка"
        Qty:
          type: number
          example: 1
        Account:
          type: string
          example: "1-3101-006"
          description: "TrdAccId из GET /api/v1/accounts"
        ClientCode:
          type: string
          example: "006"
    Order:
      type: object
      properties:
        OrderNum: {type: integer, format: int64, nullable: true, description: "Номер заявки в QUIK"}
        State: {type: string, nullable: true, description: "Активна, Исполнена, Снята, Отклонена"}
        ClassCode: {type: string}
        SecCode: {type: string}
        Operation: {type: string, enum: ["Купля", "Продажа"]}
        Price: {type: number, nullable: true}
        Qty: {type: number}
        Balance: {type: number, description: Остаток}
        Account: {type: string}
        ClientCode: {type: string}
        FirmId: {type: string}
        RejectReason: {type: string, nullable: true}
        id: {type: string, format: uuid}
    QuikOrderRow:
      type: object
      additionalProperties: true
      properties:
        OrderNum: {type: number}
        ClassCode: {type: string}
        TradeDate: {type: string}
        SecCode: {type: string}
        FirmId: {type: string}
        Operation: {type: string}
        State: {type: string}
      example: {"OrderNum": 9007199254740993123, "ClassCode": "LIST_GBA", "TradeDate": "2026-10-22T00:00:00", "SecCode": "GBA02280810", "FirmId": "2040", "Operation": "Купля", "State": "Активна", "Qty": 10, "Balance": 8, "Price": 105.12345678}
    QuikTradingAccountRow:
      type: object
      additionalProperties: true
      properties:
        TrdAccId: {type: string}
        FirmId: {type: string}
    QuikFirmRow:
      type: object
      additionalProperties: true
      properties:
        FirmId: {type: string}
        FirmName: {type: string, nullable: true}
    Instrument:
      type: object
      additionalProperties: true
      properties:
        TradeDate: {type: string}
        ClassCode: {type: string}
        SecCode: {type: string}
        FaceUnit: {type: string, nullable: true, description: Валюта}
        SecShortName: {type: string, nullable: true}
        SecFullName: {type: string, nullable: true}
      example: {"TradeDate": "2026-11-02T00:00:00", "ClassCode": "LIST_GBA", "SecCode": "GBA02280810", "FaceUnit": "KGS", "SecShortName": "ГКО", "SecFullName": "Государственная бумага"}
    BookLevel:
      type: object
      properties:
        price:
          type: string
          example: "99.5"
        size:
          type: string
          example: "10"
    MarketDataRow:
      type: object
      additionalProperties: true
      properties:
        ClassCode: {type: string}
        SecCode: {type: string}
        CouponValue: {type: number, nullable: true}
        status: {type: string, nullable: true}
        FaceUnit: {type: string, nullable: true, description: Валюта}
        SecShortName: {type: string, nullable: true}
        SecFullName: {type: string, nullable: true}
        ClassName: {type: string, nullable: true}
        lotsize: {type: number, nullable: true, description: Размер лота}
        tradingstatus: {type: string, nullable: true, description: Состояние сессии}
        pricemin: {type: number, nullable: true, description: Минимально возможная цена}
        pricemax: {type: number, nullable: true, description: Максимально возможная цена}
        realminstep: {type: number, nullable: true, description: Минимальный шаг цены}
        bid: {type: number, nullable: true, description: Лучшая цена спроса}
        biddepth: {type: number, nullable: true, description: Спрос по лучшей цене}
        offer: {type: number, nullable: true, description: Лучшая цена предложения}
        offerdepth: {type: number, nullable: true, description: Предложение по лучшей цене}
        last: {type: number, nullable: true, description: Цена последней сделки}
        qty: {type: number, nullable: true, description: Количество в последней сделке}
        time: {type: string, nullable: true, description: Время последней сделки}
        open: {type: number, nullable: true, description: Цена открытия}
        high: {type: number, nullable: true, description: Максимальная цена сделки}
        low: {type: number, nullable: true, description: Минимальная цена сделки}
        prevprice: {type: number, nullable: true, description: Цена закрытия}
        waprice: {type: number, nullable: true, description: Средневзвешенная цена}
        numtrades: {type: number, nullable: true, description: Количество сделок за сегодня}
        voltoday: {type: number, nullable: true, description: Количество во всех сделках}
        valtoday: {type: number, nullable: true, description: Оборот в деньгах}
        accruedint: {type: number, nullable: true, description: Накопленный купонный доход}
        yield: {type: number, nullable: true, description: Доходность последней сделки}
        nextcoupon: {type: string, nullable: true, description: Дата выплаты купона}
        couponperiod: {type: number, nullable: true, description: Длительность купона}
    MarketTrade:
      type: object
      required: [TradeNum, ClassCode, SecCode, TradeDateTime, Price, Qty, SettleCurrency, Kind, CanceledDateTime]
      additionalProperties: false
      properties:
        TradeNum: {type: number, description: Номер сделки}
        ClassCode: {type: string}
        SecCode: {type: string}
        TradeDateTime: {type: string, format: date-time, description: "Время исполнения, +06:00"}
        Price: {type: number, nullable: true, description: Цена за единицу без комиссий}
        Qty: {type: number, nullable: true, description: Количество}
        SettleCurrency: {type: string, nullable: true, description: Валюта расчётов}
        Kind: {type: string, nullable: true, description: Вид сделки}
        CanceledDateTime: {type: string, format: date-time, nullable: true, description: "Время отмены, +06:00; null — сделка действует"}
      example: {TradeNum: 4914, ClassCode: LIST_GBA, SecCode: GBA02270915, TradeDateTime: "2026-11-05T14:32:57.000+06:00", Price: 95.00000000, Qty: 10.00000000, SettleCurrency: KGS, Kind: Обычная, CanceledDateTime: null}
    OrderBook:
      type: object
      properties:
        symbol:
          type: string
        security_id:
          type: string
        board:
          type: string
        currency:
          type: string
        name:
          type: string
        last:
          type: string
        last_size:
          type: string
        last_time:
          type: string
        bid:
          type: string
        bid_size:
          type: string
        offer:
          type: string
        offer_size:
          type: string
        bids:
          type: array
          items:
            $ref: "#/components/schemas/BookLevel"
        offers:
          type: array
          items:
            $ref: "#/components/schemas/BookLevel"
        updated_at:
          type: string
          format: date-time
    OrderBookResponse:
      type: object
      properties:
        source:
          type: string
          example: live
        live:
          type: boolean
        books:
          type: array
          items:
            $ref: "#/components/schemas/OrderBook"
        note:
          type: string
    Trade:
      type: object
      additionalProperties: true
      properties:
        TradeNum: {type: number}
        TradeDate: {type: string}
        ClassCode: {type: string}
        SecCode: {type: string}
        OrderNum: {type: number}
        Operation: {type: string}
        Price: {type: number}
        Qty: {type: number}
        FirmId: {type: string}
        Account: {type: string}
        ClientCode: {type: string}
        CPFirmId: {type: string, description: Фирма контрагента}
      example: {"TradeNum": 11094, "TradeDate": "2026-10-06T00:00:00", "ClassCode": "LIST_GBA", "SecCode": "GBA02280810", "OrderNum": 22450, "Operation": "Купля", "Price": 99.00000000, "Qty": 201, "FirmId": "2040", "Account": "1-3101-2040", "ClientCode": "Kalys", "CPFirmId": "BAKAI2008"}
    MoneyLimitRow:
      type: object
      additionalProperties: true
      properties:
        LoadDate: {type: string}
        FirmId: {type: string}
        ClientCode: {type: string}
        Tag: {type: string}
        CurrCode: {type: string, description: Валюта}
        LimitKind: {type: string}
        CurrentBal: {type: number, description: Текущий остаток}
        OpenBal: {type: number, description: Входящий остаток}
        Locked: {type: number, description: Заблокировано}
      example: {"LoadDate": "2026-11-02T00:00:00", "FirmId": "2040", "ClientCode": "Kalys", "Tag": "EQTV", "CurrCode": "KGS", "LimitKind": "T0", "CurrentBal": 1518400.00000000, "OpenBal": 1518400.00000000, "Locked": 0.00000000}
    DepoLimitRow:
      type: object
      additionalProperties: true
      properties:
        LoadDate: {type: string}
        FirmId: {type: string}
        ClientCode: {type: string}
        SecCode: {type: string}
        Trdacc: {type: string, description: Торговый счёт}
        LimitKind: {type: string}
        CurrentBal: {type: number, description: Текущий остаток}
        OpenBal: {type: number, description: Входящий остаток}
        AwgPositionPrice: {type: number, description: Средняя цена}
      example: {"LoadDate": "2026-11-02T00:00:00", "FirmId": "2040", "ClientCode": "Kalys", "SecCode": "GBA02280810", "Trdacc": "1-3101-2040", "LimitKind": "T0", "CurrentBal": 17.00000000, "OpenBal": 17.00000000, "AwgPositionPrice": 0.00000000}
