openapi: 3.0.3
info:
  title: Кыргыз Фондулук Биржасы — Broker API
  version: 1.0.0
  description: |
    REST API для брокеров Кыргызской Фондовой Биржи.

    Авторизация: `Authorization: Bearer <API-токен>`
    Токен выдаётся оператором. `broker_id` определяется по токену автоматически.
    Подключение: VPN + TLS. Клиентские сертификаты и HMAC по умолчанию не требуются.

    **Единый формат ответа.** Любой ответ любого метода, успешный или нет, имеет вид
    `{"success": true|false, "code": "OK"|<код ошибки>, "message": null|<причина>, "error_code": null|<код QUIK>, "data": <данные>|null}`.
    Списки дополнительно содержат `has_more` и `next_offset`. Проверяйте `success`, причину берите из `message`,
    точный код причины от QUIK — из `error_code` (список всех кодов — `GET /api/v1/errors`).
    При отказе QUIK (`ORDER_REJECTED`) и ожидании ответа QUIK (`QUIK_ANSWER_PENDING`) в `data` — заявка.

    Текущие заявки — исходные строки таблицы QUIK `Orders` вашей фирмы (см. `QuikOrderRow`).

    Брокерские события gRPC имеют REST-источники: `order.updated` → GET `/api/v1/orders`,
    `trade.created` → GET `/api/v1/trades`, `positions.updated` → GET `/api/v1/positions`,
    `marketdata.tick` → GET `/api/v1/market-data`. REST возвращает текущие снимки,
    рыночные данные — исходные строки таблицы QUIK `Params` (см. `MarketDataRow`),
    gRPC передаёт обновления через `fixgateway.realtime.v1.RealtimeService/Stream`.
    REST не воспроизводит последовательность пропущенных событий.

    Единое руководство по REST и gRPC: `docs/broker-api-guide.md` в репозитории.
  contact:
    name: KSE Gateway Support
servers:
  - url: http://localhost:8080
    description: Local development
tags:
  - name: Проверка связи
    description: Health
  - name: Фирма
    description: Код фирмы текущего токена
  - name: Справочники
    description: Инструменты, стакан и счета
  - name: Заявки
    description: Создание, просмотр и снятие заявок
  - name: Сделки
    description: Список сделок (fills)
  - name: Позиции
    description: Снимок позиций из QUIK
  - name: Рыночные данные
    description: Текущие торги, статистика и торговый статус инструментов
paths:
  /health:
    get:
      tags: [Проверка связи]
      summary: Liveness
      description: Возвращает 200 если процесс жив.
      responses:
        "200":
          description: OK
  /api/v1/firm:
    get:
      tags: [Фирма]
      summary: Фирма токена — строка таблицы QUIK Firms
      security:
        - bearerAuth: []
      description: |
        Требует `orders:read`. Строка `quik_export2.public."Firms"` для фирмы токена (`quik_firm`,
        при пустом значении — код брокера) как есть (`row_to_json`).
      responses:
        "200":
          description: Строка Firms
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuikFirmRow"
        "401":
          description: Unauthorized
        "404":
          description: Фирмы нет в Firms
        "503":
          description: Источник QUIK недоступен
  /api/v1/errors:
    get:
      tags: [Справочники]
      summary: Коды ошибок
      security:
        - bearerAuth: []
      description: |
        Справочник кодов ответа. `codes` — значения поля `code` (тип ответа шлюза и HTTP-статус).
        `error_codes` — значения поля `error_code`: причины отказа от QUIK. `operation`: `order` — отказ заявки
        (FIX 103), `cancel` — отказ снятия (FIX 102); одно число может означать разное в этих операциях.
        QUIK может прислать код, которого нет в списке: текст причины всегда есть в `message`.
      responses:
        "200":
          description: Справочник кодов
          content:
            application/json:
              schema:
                type: object
                properties:
                  codes:
                    type: array
                    items:
                      type: object
                      properties:
                        code: {type: string}
                        http_status: {type: integer}
                        description: {type: string}
                  error_codes:
                    type: array
                    items:
                      type: object
                      properties:
                        error_code: {type: integer}
                        operation: {type: string, enum: [order, cancel]}
                        source: {type: string}
                        description: {type: string}
              example:
                codes:
                  - {code: ORDER_REJECTED, http_status: 422, description: "QUIK отклонил заявку; причина — message и error_code"}
                error_codes:
                  - {error_code: 8637225, operation: order, source: "Дилерская библиотека QUIK (проверка лимитов и прав)", description: "Работа по данному торговому счёту запрещена"}
        "401":
          description: Нет токена
  /api/v1/instruments:
    get:
      tags: [Справочники]
      summary: Список активных инструментов
      security:
        - bearerAuth: []
      description: |
        Требует `orders:read`. Используйте `quik_symbol` + `board` при создании заявки.
        Только инструменты классов, выбранных биржей (те же, что в `/api/v1/market-data`).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  instruments:
                    type: array
                    items:
                      $ref: "#/components/schemas/Instrument"
        "401":
          description: Unauthorized
  /api/v1/market-data:
    get:
      tags: [Рыночные данные]
      summary: Текущие торги — инструменты выбранных классов QUIK
      x-grpc-event: marketdata.tick
      security:
        - bearerAuth: []
      description: |
        Требует `orders:read`. REST-источник события gRPC `marketdata.tick`.
        Возвращает JSON-массив инструментов из `quik_export2.public."Params"` с полями
        `ClassCode`, `SecCode`, `status` (из `Params`), `CouponValue`, `FaceUnit`, `SecShortName`,
        `SecFullName` (из `Securities`, инструмент сопоставляется по `ClassCode` и `SecCode`)
        и `ClassName` (из `Classes`, по `ClassCode`). Значения в исходном виде: числа
        JSON-числами с исходной точностью, строки и `null`; без записи в справочнике — `null`.
        Данные рынка не зависят от фирмы токена. Возвращаются только строки текущего
        торгового дня (`TradeDate` — сегодняшняя дата по Бишкеку, UTC+6) и только классов,
        выбранных администратором шлюза (если классы не выбраны — всех классов).

        `board` и `symbol` фильтруют колонки `ClassCode` и `SecCode`. Порядок —
        `ClassCode`, `SecCode`. Пагинация — в заголовках `X-Has-More` и `X-Next-Offset`.
        При недоступности источника — HTTP 503 с `Retry-After`; данные FIX не подставляются.
        Пустая успешная выборка — `[]`.
      parameters:
        - in: query
          name: board
          schema: {type: string}
          description: Значение колонки ClassCode
          example: LISTBND
        - in: query
          name: symbol
          schema: {type: string}
          description: Значение колонки SecCode
          example: GBA02270915
        - {in: query, name: limit, schema: {type: integer, minimum: 1, maximum: 5000, default: 1000}}
        - {in: query, name: offset, schema: {type: integer, minimum: 0, maximum: 10000000, default: 0}}
      responses:
        "200":
          description: Инструменты текущих торгов
          headers:
            X-Has-More: {schema: {type: boolean}}
            X-Next-Offset: {schema: {type: integer}}
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MarketDataRow"
              example:
                - {ClassCode: LISTBND, SecCode: GBA02270915, CouponValue: 2.5, status: торгуется, FaceUnit: KGS, SecShortName: "ГКО-2 летние (GBA02270915)", SecFullName: "ГКО-2 летние (GBA02270915)", ClassName: "Листинговые:облигации"}
        "400":
          description: Неверные limit/offset
        "401":
          description: Unauthorized
        "403":
          description: Нет права orders:read или IP не в whitelist
        "429":
          description: Rate limited
        "503":
          description: Источник Params недоступен, авторизация или исчерпана ёмкость обработки
  /api/v1/market-data/{board}/{symbol}:
    get:
      tags: [Рыночные данные]
      summary: Один инструмент текущих торгов по ClassCode и SecCode
      security:
        - bearerAuth: []
      description: Требует `orders:read`. Возвращает строку того же вида, что и список, или 404, если инструмента нет за сегодня или его класс не выбран администратором.
      parameters:
        - {in: path, name: board, required: true, schema: {type: string}, description: ClassCode}
        - {in: path, name: symbol, required: true, schema: {type: string}, description: SecCode}
      responses:
        "200":
          description: Инструмент
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketDataRow"
        "401":
          description: Unauthorized
        "403":
          description: Нет права orders:read или IP не в whitelist
        "404":
          description: Инструмента нет за сегодня или класс не выбран
        "503":
          description: Источник Params недоступен
  /api/v1/quotes:
    get:
      tags: [Рыночные данные]
      summary: Котировки инструмента — сегодняшние активные заявки рынка
      security:
        - bearerAuth: []
      description: |
        Требует `orders:read`. Котировки одного инструмента (`board` = `ClassCode`,
        `symbol` = `SecCode`, оба обязательны): активные заявки (`State` = `Активна`)
        сегодняшнего торгового дня (по Бишкеку, UTC+6) всех участников рынка.
        Для класса, не выбранного биржей, — пустой список.

        Участники не раскрываются: котировка содержит только сторону `side` (`BUY`/`SELL`),
        цену `price`, оставшееся количество `quantity` и объём `volume` = `price` × `quantity`.
        Номера заявок, фирмы, счета и коды клиентов не передаются. Числа — JSON-числа
        с исходной точностью; если значение недоступно — `null`.

        Порядок — от новых заявок к старым. Страницы: заголовки `X-Has-More` и `X-Next-Offset`;
        следующую страницу запрашивайте с `offset` = `X-Next-Offset`. Страницы не являются
        снимком: если заявки меняются между запросами, перечитайте список с первой страницы.
      parameters:
        - {in: query, name: board, required: true, schema: {type: string}, description: ClassCode инструмента, example: LISTBND}
        - {in: query, name: symbol, required: true, schema: {type: string}, description: SecCode инструмента, example: GBA02270915}
        - {in: query, name: limit, schema: {type: integer, minimum: 1, maximum: 1000, default: 200}}
        - {in: query, name: offset, schema: {type: integer, minimum: 0, maximum: 10000000, default: 0}}
      responses:
        "200":
          description: Котировки инструмента
          headers:
            X-Has-More: {schema: {type: boolean}, description: Есть ли следующая страница}
            X-Next-Offset: {schema: {type: integer}, description: offset следующей страницы}
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [side, price, quantity, volume]
                  additionalProperties: false
                  properties:
                    side: {type: string, enum: [BUY, SELL], nullable: true}
                    price: {type: number, nullable: true, description: Цена заявки}
                    quantity: {type: number, nullable: true, description: Оставшееся количество}
                    volume: {type: number, nullable: true, description: price × quantity}
              example:
                - {side: BUY, price: 100, quantity: 10, volume: 1000}
                - {side: SELL, price: 100.5, quantity: 4, volume: 402}
        "400":
          description: Не указаны board и symbol, неверный limit или offset
        "401":
          description: Unauthorized
        "403":
          description: Нет права orders:read или IP не в whitelist
        "429":
          description: Rate limited
        "503":
          description: Источник QUIK Orders недоступен; данные не подменяются
  /api/v1/orderbook:
    get:
      tags: [Справочники]
      summary: Стакан активных заявок
      security:
        - bearerAuth: []
      description: |
        Требует `orders:read`.

        Живой стакан рынка по подписанным инструментам (FIX Market Data, полный стакан),
        только классы, выбранные биржей.
        `bids` — спрос (лучшая цена первой), `offers` — предложение.
        Это не заявки брокера, а видимые уровни для построения стакана торгов.

        Фильтры `symbol` и `board` необязательны. Без них вернутся все инструменты.
      parameters:
        - in: query
          name: symbol
          schema:
            type: string
          description: Код инструмента
          example: GBA02280810
        - in: query
          name: board
          schema:
            type: string
          description: Код класса
          example: LIST_GBA
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderBookResponse"
              example:
                source: live
                live: true
                books:
                  - symbol: GBA02280810
                    security_id: GBA02280810
                    board: LIST_GBA
                    currency: KGS
                    bid: "99.5"
                    bid_size: "10"
                    offer: "100.5"
                    offer_size: "12"
                    bids:
                      - price: "99.5"
                        size: "10"
                    offers:
                      - price: "100.5"
                        size: "12"
        "401":
          description: Unauthorized
  /api/v1/accounts:
    get:
      tags: [Справочники]
      summary: Торговые счета фирмы токена — строки QUIK Trdaccs
      security:
        - bearerAuth: []
      description: |
        Требует `orders:read`. JSON-массив строк `quik_export2.public."Trdaccs"` с `FirmId` фирмы токена,
        как есть (`row_to_json`). В `account_id` заявки передавайте `TrdAccId` одной из этих строк:
        другие значения заявка не принимает. Счета заводятся в QUIK, не в Gateway.
      responses:
        "200":
          description: Строки Trdaccs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/QuikTradingAccountRow"
        "401":
          description: Unauthorized
        "503":
          description: Источник QUIK недоступен
  /api/v1/orders:
    post:
      tags: [Заявки]
      summary: Создать заявку
      security:
        - bearerAuth: []
      description: |
        Требует `orders:create`. Поля запроса и ответа называются как колонки таблицы QUIK `Orders`.
        `FirmId` берётся из `quik_firm` токена. Заявка с `Price` — лимитная, без `Price` — рыночная; срок — день.

        Шлюз сразу отправляет заявку в QUIK и отвечает, когда QUIK её принял или отклонил (обычно меньше секунды, ожидание — до 10 с):
        - `201` — QUIK принял заявку, `OrderNum` — номер заявки в QUIK;
        - `422` `ORDER_REJECTED` — QUIK отклонил заявку, причина в `RejectReason`;
        - `502` `ORDER_FAILED` — заявку не удалось передать в QUIK;
        - `202` `QUIK_ANSWER_PENDING` — QUIK не ответил за время ожидания. Заявка не отменена и может быть принята позже: узнайте итог через `GET /api/v1/orders/{id}`, не отправляйте её заново.

        Каждый запрос создаёт новую заявку. После таймаута или сетевой ошибки сначала проверьте `GET /api/v1/orders`, и только потом отправляйте заявку повторно: иначе она может быть выставлена дважды.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderRequest"
            example:
              ClassCode: "LIST_GBA"
              SecCode: "GBA02270915"
              Operation: "Купля"
              Price: 400
              Qty: 1
              Account: "1-3101-006"
              ClientCode: "006"
      responses:
        "201":
          description: QUIK принял заявку
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
              example:
                OrderNum: 26102912345
                State: "Активна"
                ClassCode: "LIST_GBA"
                SecCode: "GBA02270915"
                Operation: "Купля"
                Price: 400
                Qty: 1
                Balance: 1
                Account: "1-3101-006"
                ClientCode: "006"
                FirmId: "SENTI2004"
                RejectReason: null
                id: "276d043c-6716-4ebd-a7b7-15904e760d40"
        "202":
          description: QUIK не ответил за время ожидания (`QUIK_ANSWER_PENDING`). Заявка не отменена; итог — через GET /api/v1/orders/{id}.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "502":
          description: Заявку не удалось передать в QUIK (`ORDER_FAILED`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "422":
          description: |
            QUIK отклонил заявку (`ORDER_REJECTED`: ответ — заявка с `State` = `Отклонена` и `RejectReason`)
            или шлюз не создал её (`TRADING_PAUSED`, `MAX_ORDER_QUANTITY`, `MAX_OPEN_ORDERS`: только `error` и `code`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
              example:
                code: "ORDER_REJECTED"
                error: "rejected by QUIK"
                OrderNum: null
                State: "Отклонена"
                ClassCode: "LIST_GBA"
                SecCode: "GBA02270915"
                Operation: "Купля"
                Price: 400
                Qty: 1
                Balance: 1
                Account: "1-3101-006"
                ClientCode: "006"
                FirmId: "SENTI2004"
                RejectReason: "Недостаточно средств"
                id: "276d043c-6716-4ebd-a7b7-15904e760d40"
        "400":
          description: Ошибка валидации
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden (нет права или IP не в whitelist)
        "429":
          description: Rate limited
    get:
      tags: [Заявки]
      summary: Список заявок брокера
      x-grpc-event: order.updated
      security:
        - bearerAuth: []
      description: |
        Требует `orders:read`. Текущие заявки из таблицы QUIK `Orders` только вашей фирмы
        (`quik_firm` токена, при пустом значении — код брокера). Ответ — JSON-массив исходных
        строк БД: имена колонок, числа, строки и `null` без изменений, в поле `data`, без
        вычисляемых полей. Числа могут иметь 19 знаков (`OrderNum`) — разбирайте их без потери точности.
        Страницы: заголовки `X-Has-More` и `X-Next-Offset`. Если таблица меняется между запросами,
        перечитайте список с первой страницы. REST-источник события gRPC `order.updated`.
      parameters:
        - {in: query, name: limit, schema: {type: integer, minimum: 1, maximum: 1000, default: 200}}
        - {in: query, name: offset, schema: {type: integer, minimum: 0, maximum: 10000000, default: 0}}
      responses:
        "200":
          description: Исходные строки QUIK Orders
          headers:
            X-Has-More: {schema: {type: boolean}, description: Есть ли следующая страница}
            X-Next-Offset: {schema: {type: integer}, description: offset следующей страницы}
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/QuikOrderRow"
        "400":
          description: Неверный limit или offset
        "401":
          description: Unauthorized
        "503":
          description: Источник QUIK Orders недоступен; данные не подменяются
  /api/v1/orders/active:
    get:
      tags: [Заявки]
      summary: Активные заявки брокера
      security:
        - bearerAuth: []
      description: |
        Требует `orders:read`. То же, что `GET /api/v1/orders`, но только строки QUIK `Orders`
        с `State` = `Активна`. Фильтр применяется в БД до пагинации; формат строк не меняется.
        Страницы: заголовки `X-Has-More` и `X-Next-Offset`.
      parameters:
        - {in: query, name: limit, schema: {type: integer, minimum: 1, maximum: 1000, default: 200}}
        - {in: query, name: offset, schema: {type: integer, minimum: 0, maximum: 10000000, default: 0}}
      responses:
        "200":
          description: Исходные строки QUIK Orders в состоянии «Активна»
          headers:
            X-Has-More: {schema: {type: boolean}, description: Есть ли следующая страница}
            X-Next-Offset: {schema: {type: integer}, description: offset следующей страницы}
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/QuikOrderRow"
        "400":
          description: Неверный limit или offset
        "401":
          description: Unauthorized
        "503":
          description: Источник QUIK Orders недоступен; данные не подменяются
  /api/v1/orders/{id}:
    get:
      tags: [Заявки]
      summary: Детали заявки
      security:
        - bearerAuth: []
      description: |
        Требует `orders:read`. Возвращает одну исходную строку QUIK `Orders` в поле `data`,
        переименования колонок, вычисляемых полей и истории. Тот же формат, что `data_json`
        события gRPC `order.updated`.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: |
            Ключ `quik-ГГГГММДД-КЛАСС-НОМЕР` (дата торгов, `ClassCode`, `OrderNum`)
            или UUID заявки из ответа шлюза (`order.id`), если её строка есть в `Orders`.
      responses:
        "200":
          description: Исходная строка QUIK Orders
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuikOrderRow"
        "400":
          description: Неверный ключ заявки
        "401":
          description: Unauthorized
        "404":
          description: Строки нет в Orders, она другой фирмы или UUID принадлежит другому брокеру. Отсутствие строки не означает снятие или исполнение.
        "503":
          description: Источник QUIK Orders недоступен; данные не подменяются
  /api/v1/orders/{id}/cancel:
    post:
      tags: [Заявки]
      summary: Снять заявку
      security:
        - bearerAuth: []
      description: |
        Требует `orders:cancel`. Тело не нужно. UUID шлюза или ключ `quik-ГГГГММДД-КЛАСС-НОМЕР`.
        Снять можно активную строку QUIK `Orders`, выставленную через шлюз.
        Шлюз отправляет снятие в QUIK и отвечает после ответа QUIK (ожидание до 10 с):
        - `200` — QUIK снял заявку: заявка в именах колонок `Orders` с `State` = `Снята`;
          если строка уже была снята — сама строка `Orders`;
        - `409` `CANCEL_REJECTED` — QUIK не снял заявку (она осталась активной или исполнилась);
        - `202` `QUIK_ANSWER_PENDING` — QUIK не ответил за время ожидания; итог — через `GET /api/v1/orders/{id}`.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: QUIK снял заявку
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "202":
          description: QUIK ещё не ответил на снятие (`QUIK_ANSWER_PENDING`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          description: Неверный ключ или команду нельзя выполнить
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorized
        "404":
          description: Строки нет в Orders или она другой фирмы
        "409":
          description: |
            QUIK не снял заявку (`CANCEL_REJECTED`, ответ — заявка с `code`/`error`),
            заявка не активна в QUIK или выставлена не через шлюз.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "503":
          description: Источник QUIK Orders или хранилище шлюза недоступны
  /api/v1/trades:
    get:
      tags: [Сделки]
      summary: Сделки фирмы — строки QUIK Trades
      x-grpc-event: trade.created
      security:
        - bearerAuth: []
      description: |
        Требует `trades:read`. Сделки вашей фирмы (`quik_firm` токена, при пустом значении — код брокера)
        из таблицы QUIK `Trades`, новые первыми. Ответ — JSON-массив исходных строк БД: имена колонок,
        числа, строки и `null` без изменений. Каждая строка — одна сторона сделки.
        Страницы: `limit`/`offset`, заголовки `X-Has-More` и `X-Next-Offset`.
        Событие gRPC `trade.created`: новая строка `Trades` вашей фирмы за сегодня в `event.data_json`.
      parameters:
        - {in: query, name: limit, schema: {type: integer, minimum: 1, maximum: 1000, default: 200}}
        - {in: query, name: offset, schema: {type: integer, minimum: 0, maximum: 10000000, default: 0}}
      responses:
        "200":
          description: Исходные строки QUIK Trades
          headers:
            X-Has-More: {schema: {type: boolean}, description: Есть ли следующая страница}
            X-Next-Offset: {schema: {type: integer}, description: offset следующей страницы}
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Trade"
        "503":
          description: Источник QUIK Trades недоступен
        "401":
          description: Unauthorized
        "403":
          description: Нет права `trades:read`
  /api/v1/positions:
    get:
      tags: [Позиции]
      summary: Снимок позиций брокера
      x-grpc-event: positions.updated
      security:
        - bearerAuth: []
      description: |
        Требует `positions:read`.

        Токен определяет брокера. Выборка ограничена кодом брокера и `quik_firm`
        его токена, как в событии gRPC `positions.updated`.
        Массивы `cash` и `instruments` содержат те же поля позиций.

        REST читает текущие позиции из базы шлюза. Шлюз автоматически поддерживает
        FIX-поток позиций (`35=AN`, `263=1`) и получает снимки для восстановления.
        PUT отправляет в QUIK `35=AL` и после `35=AM` обновляет снимок.
        Если снимка ещё нет, списки пустые, в `note` — пояснение.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PositionsResponse"
              example:
                source: fix
                firm_id: "2040"
                snapshot:
                  adapter_id: quik-fix-1
                  pos_req_id: POS963157-296
                  clearing_date: "20260817"
                  status: OK
                  report_count: 6
                instruments:
                  - kind: INSTRUMENT
                    firm_id: "2040"
                    client_code: kalys
                    account_code: "1-3101-2040"
                    symbol: KG0105166315
                    pos_type: DL
                    net_qty: "1000000"
                cash:
                  - kind: CASH
                    firm_id: "2040"
                    client_code: kalys
                    symbol: EQTV
                    pos_type: ML
                    net_qty: "10000000"
        "401":
          description: Unauthorized
        "403":
          description: Нет права `positions:read`
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API token
      description: |
        API-токен брокера, выданный оператором.
        Вставьте только токен — Swagger автоматически добавит `Bearer `.
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: Причина ошибки
      example: {"error": "счёт \"1-3101-006\" не найден у фирмы \"FREEDOM2003\"; список счетов — GET /api/v1/accounts"}
    CreateOrderRequest:
      type: object
      description: Имена полей — как колонки таблицы QUIK `Orders`.
      required: [ClassCode, SecCode, Operation, Qty, Account, ClientCode]
      additionalProperties: false
      properties:
        ClassCode:
          type: string
          example: "LIST_GBA"
          description: "Код класса"
        SecCode:
          type: string
          example: "GBA02270915"
          description: "Код инструмента из GET /api/v1/instruments"
        Operation:
          type: string
          enum: ["Купля", "Продажа"]
          example: "Купля"
        Price:
          type: number
          example: 400
          description: "Цена. Без Price — рыночная заявка"
        Qty:
          type: number
          example: 1
          description: "Количество"
        Account:
          type: string
          example: "1-3101-006"
          description: "Торговый счёт (TrdAccId из GET /api/v1/accounts)"
        ClientCode:
          type: string
          example: "006"
          description: "Код клиента"
    Order:
      type: object
      description: |
        Заявка в именах колонок QUIK `Orders`. `FirmId` — `quik_firm` токена.
        `id` — номер заявки в шлюзе: передавайте его в `GET /api/v1/orders/{id}` и в отмену.
      properties:
        OrderNum: {type: integer, format: int64, nullable: true, description: "Номер заявки в QUIK; null, пока QUIK не принял заявку"}
        State: {type: string, nullable: true, description: "Активна, Исполнена, Снята или Отклонена; null, пока QUIK не ответил"}
        ClassCode: {type: string}
        SecCode: {type: string}
        Operation: {type: string, enum: ["Купля", "Продажа"]}
        Price: {type: number, nullable: true, description: "null — рыночная заявка"}
        Qty: {type: number}
        Balance: {type: number, description: Неисполненный остаток}
        Account: {type: string}
        ClientCode: {type: string}
        FirmId: {type: string}
        RejectReason: {type: string, nullable: true, description: Причина отказа QUIK}
        id: {type: string, format: uuid}
    QuikOrderRow:
      type: object
      additionalProperties: true
      description: |
        Строка `quik_export2.public."Orders"` как есть (`row_to_json`). Набор колонок задаёт QUIK;
        шлюз не добавляет и не переименовывает поля. Ниже — колонки, по которым шлюз ищет строку.
      properties:
        OrderNum: {type: number, description: "Номер заявки QUIK, до 19 знаков"}
        ClassCode: {type: string}
        TradeDate: {type: string}
        SecCode: {type: string}
        FirmId: {type: string}
        Operation: {type: string}
        State: {type: string}
      example: {"OrderNum": 9007199254740993123, "ClassCode": "LIST_GBA", "TradeDate": "2026-10-22T00:00:00", "SecCode": "GBA02280810", "FirmId": "2040", "Operation": "Купля", "State": "Активна", "Qty": 10, "Balance": 8, "Price": 105.12345678}
    OrderEvent:
      type: object
      properties:
        id: {type: integer, format: int64}
        order_id: {type: string, format: uuid}
        event_type: {type: string}
        from_status: {type: string, nullable: true}
        to_status: {type: string, nullable: true}
        adapter_id: {type: string, nullable: true}
        message: {type: string}
        raw_fix: {type: string}
        created_at: {type: string, format: date-time}
    QuikTradingAccountRow:
      type: object
      additionalProperties: true
      description: Строка `quik_export2.public."Trdaccs"` как есть; набор колонок задаёт QUIK.
      properties:
        TrdAccId: {type: string, description: Торговый счёт → Account заявки}
        FirmId: {type: string}
    QuikFirmRow:
      type: object
      additionalProperties: true
      description: Строка `quik_export2.public."Firms"` как есть; набор колонок задаёт QUIK.
      properties:
        FirmId: {type: string}
        FirmName: {type: string, nullable: true}
    Instrument:
      type: object
      properties:
        id:
          type: integer
        internal_symbol:
          type: string
        quik_symbol:
          type: string
          example: KG0105166315
        board:
          type: string
          example: LISTEDSTOCKK
        currency:
          type: string
          example: KZT
        security_type:
          type: string
        status:
          type: string
          example: ACTIVE
    BookLevel:
      type: object
      properties:
        price:
          type: string
          example: "99.5"
        size:
          type: string
          example: "10"
    MarketDataRow:
      type: object
      additionalProperties: true
      description: |
        Инструмент текущих торгов: колонки QUIK `Params`, `Securities` и `Classes` в исходном
        виде (`row_to_json`), без переименования и пересчёта.
      properties:
        ClassCode: {type: string, description: Params.ClassCode}
        SecCode: {type: string, description: Params.SecCode}
        CouponValue: {type: number, nullable: true, description: Securities.CouponValue}
        status: {type: string, nullable: true, description: Params.status}
        FaceUnit: {type: string, nullable: true, description: Securities.FaceUnit}
        SecShortName: {type: string, nullable: true, description: Securities.SecShortName}
        SecFullName: {type: string, nullable: true, description: Securities.SecFullName}
        ClassName: {type: string, nullable: true, description: Classes.ClassName}
    OrderBook:
      type: object
      properties:
        symbol:
          type: string
        security_id:
          type: string
        board:
          type: string
        currency:
          type: string
        name:
          type: string
        last:
          type: string
        last_size:
          type: string
        last_time:
          type: string
        bid:
          type: string
        bid_size:
          type: string
        offer:
          type: string
        offer_size:
          type: string
        bids:
          type: array
          items:
            $ref: "#/components/schemas/BookLevel"
        offers:
          type: array
          items:
            $ref: "#/components/schemas/BookLevel"
        updated_at:
          type: string
          format: date-time
    OrderBookResponse:
      type: object
      properties:
        source:
          type: string
          example: live
        live:
          type: boolean
        books:
          type: array
          items:
            $ref: "#/components/schemas/OrderBook"
        note:
          type: string
    Trade:
      type: object
      additionalProperties: true
      description: |
        Строка `quik_export2.public."Trades"` как есть (`row_to_json`): одна сторона сделки.
        Набор колонок задаёт QUIK; шлюз не добавляет и не переименовывает поля. Ниже — основные колонки.
      properties:
        TradeNum: {type: number, description: "Номер сделки QUIK"}
        TradeDate: {type: string}
        ClassCode: {type: string}
        SecCode: {type: string}
        OrderNum: {type: number, description: "Номер заявки QUIK"}
        Operation: {type: string, description: "Купля / Продажа"}
        Price: {type: number}
        Qty: {type: number}
        FirmId: {type: string}
        Account: {type: string}
        ClientCode: {type: string}
        CPFirmId: {type: string, description: "Фирма контрагента"}
      example: {"TradeNum": 11094, "TradeDate": "2026-10-06T00:00:00", "ClassCode": "LIST_GBA", "SecCode": "GBA02280810", "OrderNum": 22450, "Operation": "Купля", "Price": 99.00000000, "Qty": 201, "FirmId": "2040", "Account": "1-3101-2040", "ClientCode": "Kalys", "CPFirmId": "BAKAI2008"}
    Position:
      type: object
      properties:
        adapter_id: {type: string}
        pos_maint_rpt_id: {type: string}
        pos_req_id: {type: string}
        clearing_date: {type: string}
        update_action: {type: string, description: "FIX 5024: 0 New / 1 Change / 2 Delete"}
        pos_amt_type: {type: string}
        pos_amt: {type: string}
        raw_fix: {type: string, description: Не включается в gRPC-снимок}
        kind:
          type: string
          enum: [INSTRUMENT, CASH, FUTURES]
        firm_id:
          type: string
          example: "2040"
        client_code:
          type: string
        account_code:
          type: string
        symbol:
          type: string
        security_id:
          type: string
        board:
          type: string
        currency:
          type: string
        pos_type:
          type: string
          description: ML деньги, DL инструмент, FL/FP фьючерсы
        long_qty:
          type: string
        short_qty:
          type: string
        net_qty:
          type: string
        settl_price:
          type: string
        source:
          type: string
          enum: [fix]
        keys:
          type: object
          additionalProperties:
            type: string
        items:
          type: object
          additionalProperties:
            type: string
    PositionSnapshot:
      type: object
      properties:
        id:
          type: integer
        adapter_id:
          type: string
        pos_req_id:
          type: string
        clearing_date:
          type: string
        requested_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
        status:
          type: string
          example: OK
        error:
          type: string
        report_count:
          type: integer
    PositionsResponse:
      type: object
      properties:
        source:
          type: string
          enum: [fix]
          example: fix
        firm_id:
          type: string
          description: Код брокера, по которому отфильтрован снимок
          example: "2040"
        snapshot:
          $ref: "#/components/schemas/PositionSnapshot"
        instruments:
          type: array
          items:
            $ref: "#/components/schemas/Position"
        cash:
          type: array
          items:
            $ref: "#/components/schemas/Position"
        note:
          type: string
          description: Пояснение, если снимка ещё нет
