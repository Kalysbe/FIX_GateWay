openapi: 3.0.3
info:
  title: Кыргыз Фондулук Биржасы — Broker API
  version: 1.0.0
  description: |
    REST API для брокеров Кыргызской Фондовой Биржи.

    Авторизация: `Authorization: Bearer <API-токен>`
    Токен выдаётся оператором. `broker_id` определяется по токену автоматически.
    Подключение: VPN + TLS. Клиентские сертификаты и HMAC по умолчанию не требуются.

    Текущие заявки — исходные строки таблицы QUIK `Orders` вашей фирмы (см. `QuikOrderRow`).

    Брокерские события gRPC имеют REST-источники: `order.updated` → GET `/api/v1/orders`,
    `trade.created` → GET `/api/v1/trades`, `positions.updated` → GET `/api/v1/positions`,
    `marketdata.tick` → GET `/api/v1/market-data`. REST возвращает текущие снимки,
    рыночные данные — исходные строки таблицы QUIK `Params` (см. `MarketDataRow`),
    gRPC передаёт обновления через `fixgateway.realtime.v1.RealtimeService/Stream`.
    REST не воспроизводит последовательность пропущенных событий.

    Единое руководство по REST и gRPC: `docs/broker-api-guide.md` в репозитории.
  contact:
    name: KSE Gateway Support
servers:
  - url: http://localhost:8080
    description: Local development
tags:
  - name: Проверка связи
    description: Health и readiness
  - name: Фирма
    description: Код фирмы текущего токена
  - name: Справочники
    description: Инструменты, стакан и счета
  - name: Заявки
    description: Создание, просмотр и снятие заявок
  - name: Сделки
    description: Список сделок (fills)
  - name: Позиции
    description: Снимок позиций из QUIK
  - name: Рыночные данные
    description: Текущие торги, статистика и торговый статус инструментов
paths:
  /health:
    get:
      tags: [Проверка связи]
      summary: Liveness
      description: Возвращает 200 если процесс жив.
      responses:
        "200":
          description: OK
  /ready:
    get:
      tags: [Проверка связи]
      summary: Readiness
      description: Возвращает 200 если есть хотя бы один рабочий FIX-адаптер.
      responses:
        "200":
          description: Ready
        "503":
          description: Not ready
  /api/v1/firm:
    get:
      tags: [Фирма]
      summary: Фирма токена — строка таблицы QUIK Firms
      security:
        - bearerAuth: []
      description: |
        Требует `orders:read`. Строка `quik_export2.public."Firms"` для фирмы токена (`quik_firm` → FIX tag 5018,
        при пустом значении — код брокера) как есть (`row_to_json`).
      responses:
        "200":
          description: Строка Firms
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuikFirmRow"
        "401":
          description: Unauthorized
        "404":
          description: Фирмы нет в Firms
        "503":
          description: Источник QUIK недоступен
  /api/v1/instruments:
    get:
      tags: [Справочники]
      summary: Список активных инструментов
      security:
        - bearerAuth: []
      description: |
        Требует `orders:read`. Используйте `quik_symbol` + `board` при создании заявки.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  instruments:
                    type: array
                    items:
                      $ref: "#/components/schemas/Instrument"
        "401":
          description: Unauthorized
  /api/v1/market-data:
    get:
      tags: [Рыночные данные]
      summary: Текущие торги — инструменты выбранных классов QUIK
      x-grpc-event: marketdata.tick
      security:
        - bearerAuth: []
      description: |
        Требует `orders:read`. REST-источник события gRPC `marketdata.tick`.
        Возвращает JSON-массив инструментов из `quik_export2.public."Params"` с полями
        `ClassCode`, `SecCode`, `status` (из `Params`), `CouponValue`, `FaceUnit`, `SecShortName`,
        `SecFullName` (из `Securities`, инструмент сопоставляется по `ClassCode` и `SecCode`)
        и `ClassName` (из `Classes`, по `ClassCode`). Значения в исходном виде: числа
        JSON-числами с исходной точностью, строки и `null`; без записи в справочнике — `null`.
        Данные рынка не зависят от фирмы токена. Возвращаются только строки текущего
        торгового дня (`TradeDate` — сегодняшняя дата по Бишкеку, UTC+6) и только классов,
        выбранных администратором шлюза (по умолчанию `LISTBND`).

        `board` и `symbol` фильтруют колонки `ClassCode` и `SecCode`. Порядок —
        `ClassCode`, `SecCode`. Пагинация — в заголовках `X-Has-More` и `X-Next-Offset`.
        При недоступности источника — HTTP 503 с `Retry-After`; данные FIX не подставляются.
        Пустая успешная выборка — `[]`.
      parameters:
        - in: query
          name: board
          schema: {type: string}
          description: Значение колонки ClassCode
          example: LISTBND
        - in: query
          name: symbol
          schema: {type: string}
          description: Значение колонки SecCode
          example: GBA02270915
        - {in: query, name: limit, schema: {type: integer, minimum: 1, maximum: 5000, default: 1000}}
        - {in: query, name: offset, schema: {type: integer, minimum: 0, maximum: 10000000, default: 0}}
      responses:
        "200":
          description: Инструменты текущих торгов
          headers:
            X-Has-More: {schema: {type: boolean}}
            X-Next-Offset: {schema: {type: integer}}
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MarketDataRow"
              example:
                - {ClassCode: LISTBND, SecCode: GBA02270915, CouponValue: 2.5, status: торгуется, FaceUnit: KGS, SecShortName: "ГКО-2 летние (GBA02270915)", SecFullName: "ГКО-2 летние (GBA02270915)", ClassName: "Листинговые:облигации"}
        "400":
          description: Неверные limit/offset
        "401":
          description: Unauthorized
        "403":
          description: Нет права orders:read или IP не в whitelist
        "429":
          description: Rate limited
        "503":
          description: Источник Params недоступен, авторизация или исчерпана ёмкость обработки
  /api/v1/market-data/{board}/{symbol}:
    get:
      tags: [Рыночные данные]
      summary: Один инструмент текущих торгов по ClassCode и SecCode
      security:
        - bearerAuth: []
      description: Требует `orders:read`. Возвращает строку того же вида, что и список, или 404, если инструмента нет за сегодня или его класс не выбран администратором.
      parameters:
        - {in: path, name: board, required: true, schema: {type: string}, description: ClassCode}
        - {in: path, name: symbol, required: true, schema: {type: string}, description: SecCode}
      responses:
        "200":
          description: Инструмент
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketDataRow"
        "401":
          description: Unauthorized
        "403":
          description: Нет права orders:read или IP не в whitelist
        "404":
          description: Инструмента нет за сегодня или класс не выбран
        "503":
          description: Источник Params недоступен
  /api/v1/orderbook:
    get:
      tags: [Справочники]
      summary: Стакан активных заявок
      security:
        - bearerAuth: []
      description: |
        Требует `orders:read`.

        Живой стакан рынка по подписанным инструментам (FIX Market Data, полный стакан).
        `bids` — спрос (лучшая цена первой), `offers` — предложение.
        Это не заявки брокера, а видимые уровни для построения стакана торгов.

        Фильтры `symbol` и `board` необязательны. Без них вернутся все инструменты.
      parameters:
        - in: query
          name: symbol
          schema:
            type: string
          description: Тикер или SecurityID
          example: GBA02280810
        - in: query
          name: board
          schema:
            type: string
          description: Код класса
          example: LIST_GBA
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderBookResponse"
              example:
                source: live
                live: true
                books:
                  - symbol: GBA02280810
                    security_id: GBA02280810
                    board: LIST_GBA
                    currency: KGS
                    bid: "99.5"
                    bid_size: "10"
                    offer: "100.5"
                    offer_size: "12"
                    bids:
                      - price: "99.5"
                        size: "10"
                    offers:
                      - price: "100.5"
                        size: "12"
        "401":
          description: Unauthorized
  /api/v1/accounts:
    get:
      tags: [Справочники]
      summary: Торговые счета фирмы токена — строки QUIK Trdaccs
      security:
        - bearerAuth: []
      description: |
        Требует `orders:read`. JSON-массив строк `quik_export2.public."Trdaccs"` с `FirmId` фирмы токена,
        как есть (`row_to_json`). В `account_id` заявки передавайте `TrdAccId` одной из этих строк:
        другие значения заявка не принимает. Счета заводятся в QUIK, не в Gateway.
      responses:
        "200":
          description: Строки Trdaccs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/QuikTradingAccountRow"
        "401":
          description: Unauthorized
        "503":
          description: Источник QUIK недоступен
  /api/v1/orders:
    post:
      tags: [Заявки]
      summary: Создать заявку
      security:
        - bearerAuth: []
      description: |
        Требует `orders:create`. `broker_id` и `quik_firm` берутся из токена.

        Поля для QUIK/FIX:
        - `symbol` → FIX tag 48 SecurityID
        - `board` → FIX tag 100 ExDestination
        - `account_id` → FIX tag 1 Account
        - `client_code` → FIX tag 109 ClientID

        Идемпотентность: повтор с тем же `client_order_id` возвращает `200` + существующую заявку.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderRequest"
            example:
              account_id: "1-3101-006"
              client_code: "006"
              client_order_id: "ORD-20260818-0001"
              symbol: "KG0105166315"
              board: "LISTEDSTOCKK"
              side: "BUY"
              order_type: "LIMIT"
              time_in_force: "DAY"
              quantity: "1"
              price: "400"
      responses:
        "201":
          description: Заявка создана
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateOrderResponse"
        "200":
          description: Идемпотентный повтор — заявка уже существует
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateOrderResponse"
        "409":
          description: client_order_id уже использован заявкой с другими параметрами (инструмент, board, сторона, тип, срок, количество, цена, счёт, код клиента, фирма). Заявка не создаётся; для новой заявки нужен новый client_order_id.
          content:
            application/json:
              schema:
                type: object
                required: [error, code]
                properties:
                  error: {type: string}
                  code: {type: string, enum: [IDEMPOTENCY_CONFLICT]}
        "422":
          description: Торговая пауза или превышение quantity/open-order лимита. Отказ не создаёт заявку; идемпотентный повтор принятой заявки сохраняет доступность.
          content:
            application/json:
              schema:
                type: object
                required: [error, code]
                properties:
                  error: {type: string}
                  code: {type: string, enum: [TRADING_PAUSED, MAX_ORDER_QUANTITY, MAX_OPEN_ORDERS]}
        "400":
          description: Ошибка валидации
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden (нет права или IP не в whitelist)
        "429":
          description: Rate limited
    get:
      tags: [Заявки]
      summary: Список заявок брокера
      x-grpc-event: order.updated
      security:
        - bearerAuth: []
      description: |
        Требует `orders:read`. Текущие заявки из таблицы QUIK `Orders` только вашей фирмы
        (`quik_firm` токена, при пустом значении — код брокера). Ответ — JSON-массив исходных
        строк БД: имена колонок, числа, строки и `null` без изменений, без обёртки и
        вычисляемых полей. Числа могут иметь 19 знаков (`OrderNum`) — разбирайте их без потери точности.
        Страницы: заголовки `X-Has-More` и `X-Next-Offset`. Если таблица меняется между запросами,
        перечитайте список с первой страницы. REST-источник события gRPC `order.updated`.
      parameters:
        - {in: query, name: limit, schema: {type: integer, minimum: 1, maximum: 1000, default: 200}}
        - {in: query, name: offset, schema: {type: integer, minimum: 0, maximum: 10000000, default: 0}}
      responses:
        "200":
          description: Исходные строки QUIK Orders
          headers:
            X-Has-More: {schema: {type: boolean}, description: Есть ли следующая страница}
            X-Next-Offset: {schema: {type: integer}, description: offset следующей страницы}
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/QuikOrderRow"
        "400":
          description: Неверный limit или offset
        "401":
          description: Unauthorized
        "503":
          description: Источник QUIK Orders недоступен; данные не подменяются
  /api/v1/orders/active:
    get:
      tags: [Заявки]
      summary: Активные заявки брокера
      security:
        - bearerAuth: []
      description: |
        Требует `orders:read`. То же, что `GET /api/v1/orders`, но только строки QUIK `Orders`
        с `State` = `Активна`. Фильтр применяется в БД до пагинации; формат строк не меняется.
        Страницы: заголовки `X-Has-More` и `X-Next-Offset`.
      parameters:
        - {in: query, name: limit, schema: {type: integer, minimum: 1, maximum: 1000, default: 200}}
        - {in: query, name: offset, schema: {type: integer, minimum: 0, maximum: 10000000, default: 0}}
      responses:
        "200":
          description: Исходные строки QUIK Orders в состоянии «Активна»
          headers:
            X-Has-More: {schema: {type: boolean}, description: Есть ли следующая страница}
            X-Next-Offset: {schema: {type: integer}, description: offset следующей страницы}
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/QuikOrderRow"
        "400":
          description: Неверный limit или offset
        "401":
          description: Unauthorized
        "503":
          description: Источник QUIK Orders недоступен; данные не подменяются
  /api/v1/orders/{id}:
    get:
      tags: [Заявки]
      summary: Детали заявки
      security:
        - bearerAuth: []
      description: |
        Требует `orders:read`. Возвращает одну исходную строку QUIK `Orders` без обёртки,
        переименования колонок, вычисляемых полей и истории. Тот же формат, что `data_json`
        события gRPC `order.updated`.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: |
            Ключ `quik-ГГГГММДД-КЛАСС-НОМЕР` (дата торгов, `ClassCode`, `OrderNum`)
            или UUID заявки из ответа шлюза (`order.id`), если её строка есть в `Orders`.
      responses:
        "200":
          description: Исходная строка QUIK Orders
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuikOrderRow"
        "400":
          description: Неверный ключ заявки
        "401":
          description: Unauthorized
        "404":
          description: Строки нет в Orders, она другой фирмы или UUID принадлежит другому брокеру. Отсутствие строки не означает снятие или исполнение.
        "503":
          description: Источник QUIK Orders недоступен; данные не подменяются
  /api/v1/orders/{id}/cancel:
    post:
      tags: [Заявки]
      summary: Снять заявку
      security:
        - bearerAuth: []
      description: |
        Требует `orders:cancel`. Тело не нужно. UUID шлюза или ключ `quik-ГГГГММДД-КЛАСС-НОМЕР`.
        Снять можно активную строку QUIK `Orders`, выставленную через шлюз.
        Ответ `200` подтверждает приём команды, а не результат на бирже: дождитесь
        изменения `State` строки в `Orders`. Если строка уже снята, возвращается `{"order": <строка>}`.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Запрос на снятие принят
        "400":
          description: Неверный ключ или команду нельзя выполнить
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorized
        "404":
          description: Строки нет в Orders или она другой фирмы
        "409":
          description: Заявка не активна в QUIK или выставлена не через шлюз
        "503":
          description: Источник QUIK Orders или хранилище шлюза недоступны
  /api/v1/trades:
    get:
      tags: [Сделки]
      summary: Список сделок брокера
      x-grpc-event: trade.created
      security:
        - bearerAuth: []
      description: Требует `trades:read`. Последние 100 сделок своего брокера. Событие gRPC `trade.created` содержит исполнение (id, order_id, exec_id, last_qty, last_px, cum_qty, leaves_qty, adapter_id, created_at). REST дополнительно возвращает реквизиты заявки, инструмента, клиента и фирмы.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  trades:
                    type: array
                    items:
                      $ref: "#/components/schemas/Trade"
        "401":
          description: Unauthorized
        "403":
          description: Нет права `trades:read`
  /api/v1/positions:
    get:
      tags: [Позиции]
      summary: Снимок позиций брокера
      x-grpc-event: positions.updated
      security:
        - bearerAuth: []
      description: |
        Требует `positions:read`.

        Токен определяет брокера. Выборка ограничена кодом брокера и `quik_firm`
        его токена, как в событии gRPC `positions.updated`.
        Массивы `cash` и `instruments` содержат те же поля позиций.

        REST читает текущие позиции из базы шлюза. Шлюз автоматически поддерживает
        FIX-поток позиций (`35=AN`, `263=1`) и получает снимки для восстановления.
        PUT отправляет в QUIK `35=AL` и после `35=AM` обновляет снимок.
        Если снимка ещё нет, списки пустые, в `note` — пояснение.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PositionsResponse"
              example:
                source: fix
                firm_id: "2040"
                snapshot:
                  adapter_id: quik-fix-1
                  pos_req_id: POS963157-296
                  clearing_date: "20260817"
                  status: OK
                  report_count: 6
                instruments:
                  - kind: INSTRUMENT
                    firm_id: "2040"
                    client_code: kalys
                    account_code: "1-3101-2040"
                    symbol: KG0105166315
                    pos_type: DL
                    net_qty: "1000000"
                cash:
                  - kind: CASH
                    firm_id: "2040"
                    client_code: kalys
                    symbol: EQTV
                    pos_type: ML
                    net_qty: "10000000"
        "401":
          description: Unauthorized
        "403":
          description: Нет права `positions:read`
    put:
      tags: [Позиции]
      summary: Установить позиции по деньгам и бумагам
      security:
        - bearerAuth: []
      description: |
        Требует `positions:write`.

        Задаёт денежный остаток (ML) и/или количество бумаг (DL) в QUIK:
        Position Maintenance Request `35=AL` → отчёт `35=AM`, затем снимок `AN`/`AP`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetPositionsRequest"
            example:
              client_code: kalys
              account_code: "1-3101-2040"
              cash:
                - currency: KGS
                  client_code: kalys
                  amount: "1500000"
                  tag: EQTV
              instruments:
                - symbol: KG0105166315
                  client_code: kalys
                  board: LISTEDSTOCKK
                  quantity: "100"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetPositionsResponse"
        "400":
          description: Ошибка валидации
        "401":
          description: Unauthorized
        "403":
          description: Нет права `positions:write`
  /api/v1/positions/cash:
    put:
      tags: [Позиции]
      summary: Установить денежную позицию
      security:
        - bearerAuth: []
      description: Требует `positions:write`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetCashRequest"
            example:
              client_code: kalys
              currency: KGS
              amount: "1500000"
              tag: EQTV
      responses:
        "200":
          description: OK
        "400":
          description: Ошибка валидации
        "403":
          description: Нет права `positions:write`
    delete:
      tags: [Позиции]
      summary: Удалить денежную позицию в QUIK
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: client_code
          required: true
          schema:
            type: string
        - in: query
          name: currency
          required: true
          schema:
            type: string
        - in: query
          name: tag
          schema:
            type: string
      responses:
        "200":
          description: Снято
        "404":
          description: Не найдено
  /api/v1/positions/instruments:
    put:
      tags: [Позиции]
      summary: Установить позицию по ценным бумагам
      security:
        - bearerAuth: []
      description: Требует `positions:write`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetInstrumentRequest"
            example:
              client_code: kalys
              symbol: KG0105166315
              board: LISTEDSTOCKK
              quantity: "100"
      responses:
        "200":
          description: OK
        "400":
          description: Ошибка валидации
        "403":
          description: Нет права `positions:write`
    delete:
      tags: [Позиции]
      summary: Удалить позицию по бумагам в QUIK
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: client_code
          required: true
          schema:
            type: string
        - in: query
          name: symbol
          required: true
          schema:
            type: string
        - in: query
          name: board
          schema:
            type: string
      responses:
        "200":
          description: Снято
        "404":
          description: Не найдено
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API token
      description: |
        API-токен брокера, выданный оператором.
        Вставьте только токен — Swagger автоматически добавит `Bearer `.
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
        details:
          type: object
    CreateOrderRequest:
      type: object
      required: [account_id, client_code, client_order_id, symbol, board, side, order_type, quantity]
      properties:
        account_id:
          type: string
          example: "1-3101-006"
          description: "Торговый код счёта → FIX tag 1 Account"
        client_code:
          type: string
          example: "006"
          description: "Код клиента → FIX tag 109 ClientID"
        client_order_id:
          type: string
          example: "ORD-20260818-0001"
          description: "Ваш уникальный ID заявки (идемпотентность) → FIX tag 11"
        symbol:
          type: string
          example: "KG0105166315"
          description: "Инструмент (тикер/ISIN) из GET /api/v1/instruments"
        board:
          type: string
          example: "LISTEDSTOCKK"
          description: "Код класса → FIX tag 100 ExDestination"
        side:
          type: string
          enum: [BUY, SELL]
          example: "BUY"
        order_type:
          type: string
          enum: [MARKET, LIMIT]
          example: "LIMIT"
        time_in_force:
          type: string
          enum: [DAY, IOC, FOK, GTC]
          example: "DAY"
          default: "DAY"
        quantity:
          oneOf:
            - type: string
            - type: number
          example: "1"
          description: "Количество (строка или число)"
        price:
          oneOf:
            - type: string
            - type: number
          example: "400"
          description: "Цена для LIMIT (строка или число)"
    CreateOrderResponse:
      type: object
      properties:
        order:
          $ref: "#/components/schemas/Order"
        idempotent:
          type: boolean
    Order:
      type: object
      properties:
        id: {type: string, format: uuid}
        broker_id: {type: integer, format: int64}
        account_id: {type: string, description: Торговый код счёта}
        client_order_id: {type: string}
        instrument_id: {type: integer, format: int64}
        symbol: {type: string}
        board: {type: string}
        currency: {type: string}
        side: {type: string, enum: [BUY, SELL]}
        order_type: {type: string, enum: [MARKET, LIMIT]}
        time_in_force: {type: string}
        quantity: {type: string}
        price: {type: string, nullable: true}
        filled_quantity: {type: string}
        avg_price: {type: string}
        status:
          type: string
          enum: [RECEIVED, VALIDATING, VALIDATED, QUEUED, ROUTING, SENT, ACKNOWLEDGED, PARTIALLY_FILLED, FILLED, CANCEL_PENDING, CANCELLED, REJECTED, EXPIRED, FAILED]
        adapter_id: {type: string, nullable: true}
        fix_cl_ord_id: {type: string, nullable: true}
        quik_order_id: {type: string, nullable: true}
        client_code: {type: string}
        quik_firm: {type: string}
        firm_name: {type: string}
        reject_reason: {type: string, nullable: true}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        request_id: {type: string}
        trace_id: {type: string}
    QuikOrderRow:
      type: object
      additionalProperties: true
      description: |
        Строка `quik_export2.public."Orders"` как есть (`row_to_json`). Набор колонок задаёт QUIK;
        шлюз не добавляет и не переименовывает поля. Ниже — колонки, по которым шлюз ищет строку.
      properties:
        OrderNum: {type: number, description: "Номер заявки QUIK, до 19 знаков"}
        ClassCode: {type: string}
        TradeDate: {type: string}
        SecCode: {type: string}
        FirmId: {type: string}
        Operation: {type: string}
        State: {type: string}
      example: {"OrderNum": 9007199254740993123, "ClassCode": "LIST_GBA", "TradeDate": "2026-10-22T00:00:00", "SecCode": "GBA02280810", "FirmId": "2040", "Operation": "Купля", "State": "Активна", "Qty": 10, "Balance": 8, "Price": 105.12345678}
    OrderEvent:
      type: object
      properties:
        id: {type: integer, format: int64}
        order_id: {type: string, format: uuid}
        event_type: {type: string}
        from_status: {type: string, nullable: true}
        to_status: {type: string, nullable: true}
        adapter_id: {type: string, nullable: true}
        message: {type: string}
        raw_fix: {type: string}
        created_at: {type: string, format: date-time}
    QuikTradingAccountRow:
      type: object
      additionalProperties: true
      description: Строка `quik_export2.public."Trdaccs"` как есть; набор колонок задаёт QUIK.
      properties:
        TrdAccId: {type: string, description: Торговый счёт → account_id заявки и FIX tag 1}
        FirmId: {type: string}
    QuikFirmRow:
      type: object
      additionalProperties: true
      description: Строка `quik_export2.public."Firms"` как есть; набор колонок задаёт QUIK.
      properties:
        FirmId: {type: string}
        FirmName: {type: string, nullable: true}
    Instrument:
      type: object
      properties:
        id:
          type: integer
        internal_symbol:
          type: string
        quik_symbol:
          type: string
          example: KG0105166315
        board:
          type: string
          example: LISTEDSTOCKK
        currency:
          type: string
          example: KZT
        security_type:
          type: string
        status:
          type: string
          example: ACTIVE
    BookLevel:
      type: object
      properties:
        price:
          type: string
          example: "99.5"
        size:
          type: string
          example: "10"
    MarketDataRow:
      type: object
      additionalProperties: true
      description: |
        Инструмент текущих торгов: колонки QUIK `Params`, `Securities` и `Classes` в исходном
        виде (`row_to_json`), без переименования и пересчёта.
      properties:
        ClassCode: {type: string, description: Params.ClassCode}
        SecCode: {type: string, description: Params.SecCode}
        CouponValue: {type: number, nullable: true, description: Securities.CouponValue}
        status: {type: string, nullable: true, description: Params.status}
        FaceUnit: {type: string, nullable: true, description: Securities.FaceUnit}
        SecShortName: {type: string, nullable: true, description: Securities.SecShortName}
        SecFullName: {type: string, nullable: true, description: Securities.SecFullName}
        ClassName: {type: string, nullable: true, description: Classes.ClassName}
    OrderBook:
      type: object
      properties:
        symbol:
          type: string
        security_id:
          type: string
        board:
          type: string
        currency:
          type: string
        name:
          type: string
        last:
          type: string
        last_size:
          type: string
        last_time:
          type: string
        bid:
          type: string
        bid_size:
          type: string
        offer:
          type: string
        offer_size:
          type: string
        bids:
          type: array
          items:
            $ref: "#/components/schemas/BookLevel"
        offers:
          type: array
          items:
            $ref: "#/components/schemas/BookLevel"
        updated_at:
          type: string
          format: date-time
    OrderBookResponse:
      type: object
      properties:
        source:
          type: string
          example: live
        live:
          type: boolean
        books:
          type: array
          items:
            $ref: "#/components/schemas/OrderBook"
        note:
          type: string
    Trade:
      type: object
      properties:
        trade_match_id:
          type: string
          description: Exchange matched trade identifier (FIX 880). Distinct from per-order exec_id.
        contra_broker:
          type: string
          description: Counterparty broker from FIX 375, when disclosed.
        contra_trader:
          type: string
          description: Counterparty trader from FIX 337, not a client identifier.
        execution_date:
          type: string
          format: date
          description: FIX trade date, or UTC receipt date for legacy executions.
        broker_id: {type: integer, format: int64}
        adapter_id: {type: string, nullable: true}
        firm_name: {type: string}
        fix_cl_ord_id: {type: string, nullable: true}
        quik_order_id: {type: string, nullable: true}
        id:
          type: string
          format: uuid
        order_id:
          type: string
          format: uuid
        exec_id:
          type: string
        last_qty:
          type: string
        last_px:
          type: string
        cum_qty:
          type: string
        leaves_qty:
          type: string
        client_order_id:
          type: string
        symbol:
          type: string
        board:
          type: string
        side:
          type: string
        client_code:
          type: string
        quik_firm:
          type: string
        created_at:
          type: string
          format: date-time
    Position:
      type: object
      properties:
        adapter_id: {type: string}
        pos_maint_rpt_id: {type: string}
        pos_req_id: {type: string}
        clearing_date: {type: string}
        update_action: {type: string, description: "FIX 5024: 0 New / 1 Change / 2 Delete"}
        pos_amt_type: {type: string}
        pos_amt: {type: string}
        raw_fix: {type: string, description: Не включается в gRPC-снимок}
        kind:
          type: string
          enum: [INSTRUMENT, CASH, FUTURES]
        firm_id:
          type: string
          example: "2040"
        client_code:
          type: string
        account_code:
          type: string
        symbol:
          type: string
        security_id:
          type: string
        board:
          type: string
        currency:
          type: string
        pos_type:
          type: string
          description: ML деньги, DL инструмент, FL/FP фьючерсы
        long_qty:
          type: string
        short_qty:
          type: string
        net_qty:
          type: string
        settl_price:
          type: string
        source:
          type: string
          enum: [fix, manual]
        keys:
          type: object
          additionalProperties:
            type: string
        items:
          type: object
          additionalProperties:
            type: string
    PositionSnapshot:
      type: object
      properties:
        id:
          type: integer
        adapter_id:
          type: string
        pos_req_id:
          type: string
        clearing_date:
          type: string
        requested_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
        status:
          type: string
          example: OK
        error:
          type: string
        report_count:
          type: integer
    PositionsResponse:
      type: object
      properties:
        source:
          type: string
          enum: [fix, manual, mixed]
          example: fix
        firm_id:
          type: string
          description: Код брокера, по которому отфильтрован снимок
          example: "2040"
        snapshot:
          $ref: "#/components/schemas/PositionSnapshot"
        instruments:
          type: array
          items:
            $ref: "#/components/schemas/Position"
        cash:
          type: array
          items:
            $ref: "#/components/schemas/Position"
        note:
          type: string
          description: Пояснение, если снимка ещё нет
    SetCashRequest:
      type: object
      required: [client_code, currency, amount]
      properties:
        client_code:
          type: string
          example: kalys
        account_code:
          type: string
        currency:
          type: string
          example: KGS
        tag:
          type: string
          example: EQTV
        amount:
          oneOf:
            - type: string
            - type: number
          example: "1500000"
        open_bal:
          oneOf:
            - type: string
            - type: number
        limit:
          oneOf:
            - type: string
            - type: number
        locked:
          oneOf:
            - type: string
            - type: number
    SetInstrumentRequest:
      type: object
      required: [client_code, symbol]
      properties:
        client_code:
          type: string
        account_code:
          type: string
        symbol:
          type: string
          example: KG0105166315
        security_id:
          type: string
        board:
          type: string
          example: LISTEDSTOCKK
        currency:
          type: string
        quantity:
          oneOf:
            - type: string
            - type: number
          example: "100"
        long_qty:
          oneOf:
            - type: string
            - type: number
        short_qty:
          oneOf:
            - type: string
            - type: number
        settl_price:
          oneOf:
            - type: string
            - type: number
    SetPositionsRequest:
      type: object
      required: [client_code]
      properties:
        client_code:
          type: string
        account_code:
          type: string
        cash:
          type: array
          items:
            $ref: "#/components/schemas/SetCashRequest"
        instruments:
          type: array
          items:
            $ref: "#/components/schemas/SetInstrumentRequest"
    SetPositionsResponse:
      type: object
      properties:
        ok:
          type: boolean
        firm_id:
          type: string
        cash:
          type: array
          items:
            $ref: "#/components/schemas/Position"
        instruments:
          type: array
          items:
            $ref: "#/components/schemas/Position"
        result:
          $ref: "#/components/schemas/PositionsResponse"
