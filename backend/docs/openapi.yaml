  /api/v1/admin/orders:
    get:
      summary: List all orders
      description: JSON array of original QUIK Orders rows, with exact database field names and values. No additions or local/FIX fallback. Pagination is in X-Has-More and X-Next-Offset headers.
      parameters:
        - {in: query, name: broker_id, schema: {type: integer}, description: Select FirmId using the broker code}
        - {in: query, name: firm_id, schema: {type: string}}
        - {in: query, name: limit, schema: {type: integer, minimum: 1, maximum: 1000, default: 200}}
        - {in: query, name: offset, schema: {type: integer, minimum: 0, maximum: 10000000, default: 0}}
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
  /api/v1/admin/emitents/{symbol}/orders:
    get:
      tags: [Admin]
      summary: QUIK Quotes by emitent trading symbol
      description: |
        Takes a 4-character trading symbol, looks it up in `emitents.symbol`,
        reads `emitents.code` (4 chars), then returns rows from QUIK `"Orders"`
        where characters 7–10 of `SecCode` equal that code
        (`substring(SecCode from 7 for 4)`), joined with `"Securities"` for
        `SecShortName` and `SecFullName`.

        Calls PostgreSQL function `"Quotes"` on the QUIK export database:
        `SELECT * FROM public."Quotes"('MAIR')`.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: symbol
          required: true
          schema:
            type: string
            minLength: 4
            maxLength: 4
            example: MAIR
          description: Trading symbol, exactly 4 characters
      responses:
        "200":
          description: Emitent found; `quotes` may be empty
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmitentOrdersResponse"
              example:
                symbol: MAIR
                code: "1663"
                count: 0
                emitent:
                  id: 344
                  name: ОАО Аэропорты Кыргызстана
                  name_eng: ""
                  code: "1663"
                  symbol: MAIR
                quotes: []
        "400":
          description: Symbol is not exactly 4 characters
        "401":
          description: Unauthorized
        "404":
          description: Emitent with this symbol not found
        "503":
          description: QUIK export database is not configured
  /api/v1/admin/trades:
    get:
      summary: List recorded QUIK trades and both persisted sides
      description: Returns all persisted sides of the latest 500 exchange trades, ordered by trade date and numeric QUIK trade number. Uses trades/trade_sides, with immutable FIX and QUIK source evidence in trade_reports. No inferred counterparty rows. A side need not have a local Gateway order or ExecID. Coverage describes the entire ledger and the latest read-only QUIK reconciliation. Broker endpoints still return only their local order executions.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Latest 500 exchange trades with all persisted sides and global coverage
          content:
            application/json:
              schema:
                type: object
                properties:
                  trades:
                    type: array
                    items:
                      $ref: "#/components/schemas/RecordedTradeSide"
                  coverage:
                    type: object
                    properties:
                      trades: {type: integer}
                      sides: {type: integer}
                      complete: {type: integer}
                      incomplete: {type: integer}
                      report_errors: {type: integer}
                      last_sync_at: {type: string, format: date-time, nullable: true}
                      last_sync_records: {type: integer, nullable: true}
                      last_sync_error: {type: string, nullable: true}
                      sync_running: {type: boolean}
  /api/v1/admin/trades/{id}:
    get:
      summary: Get a trade and its recorded counterpart for the printable admin detail page
      description: Accepts a ledger trade UUID, persisted side UUID, or linked legacy execution UUID. Returns the actual saved BUY and SELL records, including sides restored from QUIK without a local Gateway order. Works outside the latest list window.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: string, format: uuid}
      responses:
        "200":
          description: Persisted sides belonging to this exchange trade
          content:
            application/json:
              schema:
                type: object
                properties:
                  trades:
                    type: array
                    items:
                      $ref: "#/components/schemas/RecordedTradeSide"
        "400":
          description: Invalid UUID
        "401":
          description: Admin authentication required
        "404":
          description: Trade not found
