    get:
      summary: Get a trade and its recorded counterpart for the printable admin detail page
      description: Accepts a ledger trade UUID, persisted side UUID, or linked legacy execution UUID. Returns the actual saved BUY and SELL records, including sides restored from QUIK without a local Gateway order. Works outside the latest list window.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: string, format: uuid}
      responses:
        "200":
          description: Persisted sides belonging to this exchange trade
          content:
            application/json:
              schema:
                type: object
                properties:
                  trades:
                    type: array
                    items:
                      $ref: "#/components/schemas/RecordedTradeSide"
