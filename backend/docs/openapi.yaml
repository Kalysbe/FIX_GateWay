      responses:
        "200":
          description: File
  /api/v1/admin/errors:
    get:
      tags: [Observability]
      summary: Error events
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/LogLimit"
        - $ref: "#/components/parameters/LogCursor"
      responses:
        "200":
          description: OK
  /api/v1/admin/events:
    get:
      tags: [Observability]
      summary: Business events
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/LogLimit"
        - $ref: "#/components/parameters/LogCursor"
      responses:
        "200":
          description: OK
  /api/v1/admin/obs-audit:
    get:
      tags: [Observability]
      summary: Observability audit events
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/LogLimit"
        - $ref: "#/components/parameters/LogCursor"
      responses:
        "200":
          description: OK
  /api/v1/admin/notifications:
    get:
      tags: [Observability]
      summary: Notifications (paginated, max 20)
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 20
            default: 20
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: offset
          schema:
            type: integer
            minimum: 0
        - in: query
          name: unread
          schema:
            type: boolean
      responses:
        "200":
          description: "`notifications`, `unread`, `total`, `page`, `has_more`"
  /api/v1/admin/notifications/read-all:
    post:
      tags: [Observability]
      summary: Mark all notifications read
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
  /api/v1/admin/notifications/{id}/read:
    post:
      tags: [Observability]
      summary: Mark one notification read
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
  /api/v1/admin/events/stream:
    get:
      tags: [Observability]
      summary: Browser event stream backed by native TLS/mTLS gRPC
      description: SSE adapter for RealtimeService.Stream. Events are filtered by current admin role. Send JWT in Authorization header. Reconnect and refresh REST state after disconnection; no replay.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Live events and heartbeat comments
          content:
            text/event-stream:
              schema:
                type: string
        "401":
          description: Invalid or revoked session
        "503":
          description: Native gRPC transport unavailable
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT or sk_test_…
      description: Broker token (`sk_test_…`) or admin JWT from `/api/v1/admin/login`. Paste token only (Swagger adds `Bearer `).
  parameters:
    BrokerID:
      in: path
      name: id
      required: true
      schema:
        type: integer
    TokenID:
      in: path
      name: id
      required: true
      schema:
        type: string
        format: uuid
    OrderID:
      in: path
      name: id
      required: true
      schema:
        type: string
        format: uuid
    AdapterID:
      in: path
      name: id
      required: true
      schema:
        type: string
    ExportJobID:
      in: path
      name: id
      required: true
      schema:
        type: string
        format: uuid
    LogLimit:
      in: query
      name: limit
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    LogCursor:
      in: query
      name: cursor
      schema:
        type: string
    LogKind:
      in: query
      name: kind
      schema:
        type: string
        enum: [all, api, orders, business, errors, auth, fix, system, audit]
  schemas:
    CreateOrderRequest:
      type: object
      description: Имена полей — как колонки таблицы QUIK Orders. Price есть — лимитная, нет — рыночная; срок DAY.
      required: [ClassCode, SecCode, Operation, Qty, Account, ClientCode]
      additionalProperties: false
      example:
        ClassCode: "LIST_GBA"
        SecCode: "GBA02270915"
        Operation: "Купля"
        Price: 400
        Qty: 1
        Account: "1-3101-006"
        ClientCode: "006"
      properties:
        ClassCode: {type: string, description: "Код класса. FIX tag 100 ExDestination"}
        SecCode: {type: string, description: "Код инструмента. FIX tag 48 SecurityID"}
        Operation: {type: string, enum: ["Купля", "Продажа"]}
        Price: {type: number, description: "Цена; без Price — рыночная заявка"}
        Qty: {type: number}
        Account: {type: string, description: "Торговый счёт. FIX tag 1 Account"}
        ClientCode: {type: string, description: "Код клиента. FIX tag 109 ClientID"}
    CreateTokenRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
        description:
          type: string
        quik_firm:
          type: string
          description: "Код фирмы QUIK → FIX tag 5018 на всех заявках этого токена"
          example: "FREEDOM2003"
        expires_in_days:
          type: integer
          description: "30, 90, 180, 365, or 0 for no expiry. Default 180."
          enum: [0, 30, 90, 180, 365]
        permissions:
          type: array
          description: "Omitted or empty grants read-only access (orders:read, trades:read, positions:read). Trading permissions must be listed explicitly."
          items:
            type: string
            enum:
              - "orders:create"
              - "orders:read"
              - "orders:cancel"
              - "orders:replace"
              - "trades:read"
              - "positions:read"
    QuikTradingAccountRow:
      type: object
      additionalProperties: true
      description: A quik_export2.public."Trdaccs" row as stored.
      properties:
        TrdAccId: {type: string}
        FirmId: {type: string}
    QuikFirmRow:
      type: object
      additionalProperties: true
      description: A quik_export2.public."Firms" row as stored.
      properties:
        FirmId: {type: string}
        FirmName: {type: string, nullable: true}
    Instrument:
      type: object
      properties:
        id:
          type: integer
        internal_symbol:
          type: string
        quik_symbol:
          type: string
          example: KG0105166315
        board:
          type: string
          example: LISTEDSTOCKK
        currency:
          type: string
          example: KZT
        security_type:
          type: string
        status:
          type: string
          example: ACTIVE
    MarketDataRow:
      type: object
      additionalProperties: true
      description: A current-trades instrument from QUIK Params, Securities and Classes, values as stored.
      properties:
        ClassCode: {type: string, description: Params.ClassCode}
        SecCode: {type: string, description: Params.SecCode}
        CouponValue: {type: number, nullable: true, description: Securities.CouponValue}
        status: {type: string, nullable: true, description: Params.status}
        FaceUnit: {type: string, nullable: true, description: Securities.FaceUnit}
        SecShortName: {type: string, nullable: true, description: Securities.SecShortName}
        SecFullName: {type: string, nullable: true, description: Securities.SecFullName}
        ClassName: {type: string, nullable: true, description: Classes.ClassName}
      example: {ClassCode: LISTBND, SecCode: GBA02270915, CouponValue: 2.5, status: торгуется, FaceUnit: KGS, SecShortName: "ГКО-2 летние (GBA02270915)", SecFullName: "ГКО-2 летние (GBA02270915)", ClassName: "Листинговые:облигации"}
    AdminTokenMetadata:
      type: object
      description: API token metadata; full credentials and storage hashes are excluded
      required: [id, broker_id, name, token_prefix, status, permissions, created_at]
      properties:
        id: {type: string, format: uuid}
        broker_id: {type: integer}
        broker_code: {type: string}
        broker_name: {type: string}
        name: {type: string}
        description: {type: string}
        token_prefix: {type: string}
        status: {type: string, enum: [ACTIVE, EXPIRED, REVOKED, DISABLED]}
        permissions: {type: array, items: {type: string}}
        quik_firm: {type: string}
        created_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time, nullable: true}
        revoked_at: {type: string, format: date-time, nullable: true}
        last_used_at: {type: string, format: date-time, nullable: true}
        last_used_ip: {type: string, nullable: true}
        rotated_from: {type: string, format: uuid, nullable: true}
    RecordedTradeSide:
      type: object
      properties:
        id: {type: string, format: uuid, description: Persisted side UUID}
        ledger_trade_id: {type: string, format: uuid}
        quik_trade_num: {type: string, description: "Exact decimal QUIK trade number, without float conversion"}
        trade_match_id: {type: string}
        execution_date: {type: string, format: date}
        side: {type: string, enum: [BUY, SELL]}
        order_id: {type: string, format: uuid, nullable: true}
        execution_id: {type: string, format: uuid, nullable: true}
        exec_id: {type: string, description: Empty when no FIX execution report was received}
        quik_order_num: {type: string}
        quik_order_id: {type: string, nullable: true}
        client_order_id: {type: string, nullable: true}
        broker_id: {type: integer, nullable: true}
        fix_cl_ord_id: {type: string, nullable: true}
        symbol: {type: string}
        board: {type: string}
        client_code: {type: string}
        quik_firm: {type: string}
        firm_name: {type: string}
        account: {type: string}
        contra_broker: {type: string}
        last_qty: {type: string}
        last_px: {type: string}
        cum_qty: {type: string, nullable: true}
        leaves_qty: {type: string, nullable: true}
        adapter_id: {type: string, nullable: true}
        has_fix_report: {type: boolean}
        has_quik_record: {type: boolean}
        created_at: {type: string, format: date-time}
        received_at: {type: string, format: date-time}
        trade_time_known: {type: boolean}
    Trade:
      type: object
      properties:
        trade_match_id:
          type: string
          description: Exchange matched trade identifier (FIX 880). Distinct from per-order exec_id.
        contra_broker:
          type: string
          description: Counterparty broker from FIX 375, when disclosed.
        contra_trader:
          type: string
          description: Counterparty trader from FIX 337, not a client identifier.
        execution_date:
          type: string
          format: date
          description: FIX trade date, or UTC receipt date for legacy executions.
        id:
          type: string
          format: uuid
        order_id:
          type: string
          format: uuid
        exec_id:
          type: string
        last_qty:
          type: string
        last_px:
          type: string
        cum_qty:
          type: string
        leaves_qty:
          type: string
        client_order_id:
          type: string
        symbol:
          type: string
        board:
          type: string
        side:
          type: string
        client_code:
          type: string
        quik_firm:
          type: string
        created_at:
          type: string
          format: date-time
    Position:
      type: object
      properties:
        kind:
          type: string
          enum: [INSTRUMENT, CASH, FUTURES]
        firm_id:
          type: string
          description: Код фирмы = код брокера (например 2040)
          example: "2040"
        client_code:
          type: string
          example: kalys
        account_code:
          type: string
          example: "1-3101-2040"
        symbol:
          type: string
        security_id:
          type: string
        board:
          type: string
        currency:
          type: string
        pos_type:
          type: string
          description: ML деньги, DL инструмент, FL/FP фьючерсы
          example: DL
        long_qty:
          type: string
        short_qty:
          type: string
        net_qty:
          type: string
        settl_price:
          type: string
        source:
          type: string
          enum: [fix]
          description: fix — из снимка QUIK
        keys:
          type: object
          additionalProperties:
            type: string
        items:
          type: object
          additionalProperties:
            type: string
    PositionSnapshot:
      type: object
      properties:
        id:
          type: integer
        adapter_id:
          type: string
          example: quik-fix-1
        pos_req_id:
          type: string
        clearing_date:
          type: string
        requested_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
        status:
          type: string
          example: OK
        report_count:
          type: integer
    PositionsResponse:
      type: object
      properties:
        source:
          type: string
          enum: [fix]
          example: fix
        firm_id:
          type: string
          description: Код брокера, по которому отфильтрован снимок
          example: "2040"
        snapshot:
          $ref: "#/components/schemas/PositionSnapshot"
        instruments:
          type: array
          items:
            $ref: "#/components/schemas/Position"
        cash:
          type: array
          items:
            $ref: "#/components/schemas/Position"
        note:
          type: string
          description: Пояснение, если снимка ещё нет
    EmitentOrdersResponse:
      type: object
      properties:
        symbol:
          type: string
          example: MAIR
        code:
          type: string
          description: emitents.code used to match SecCode[7:10]
          example: "1663"
        count:
          type: integer
          example: 0
        emitent:
          type: object
          properties:
            id:
              type: integer
              format: int64
            name:
              type: string
            name_eng:
              type: string
            code:
              type: string
            symbol:
              type: string
        quotes:
          type: array
          description: QUIK Orders rows plus Securities.SecShortName and SecFullName
          items:
            type: object
            additionalProperties: true

