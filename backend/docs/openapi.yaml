  /api/v1/admin/tokens/{id}:
    get:
      tags: [Admin]
      summary: Token overview with broker and access restrictions
      description: |
        Read-only metadata inspection. Includes broker identity/status, token rights,
        firm, creation/expiry/revocation dates, last recorded use and IP, rotation
        reference, broker request/order limits and IP whitelist. ACTIVE tokens whose
        expiry has passed are presented as EXPIRED without updating the stored row.
        Token hashes and full credentials are never returned. Cache-Control is no-store.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TokenID"
      responses:
        "200":
          description: Token overview
          content:
            application/json:
              schema:
                type: object
                required: [token, broker, ip_whitelist]
                properties:
                  token: {$ref: "#/components/schemas/AdminTokenMetadata"}
                  broker:
                    type: object
                    properties:
                      id: {type: integer}
                      code: {type: string}
                      name: {type: string}
                      status: {type: string}
                      ip_whitelist_enabled: {type: boolean}
                      rate_limit_rps: {type: integer}
                      rate_limit_orders_per_sec: {type: integer}
                  ip_whitelist:
                    type: array
                    items:
                      type: object
                      properties:
                        id: {type: integer}
                        ip_cidr: {type: string}
                        note: {type: string}
        "400": {description: Invalid token UUID}
        "401": {description: Admin session required}
        "403": {description: Insufficient role}
        "404": {description: Token not found}
    delete:
      tags: [Admin]
      summary: Revoke token
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TokenID"
      responses:
        "200":
          description: REVOKED
    patch:
      tags: [Admin]
      summary: Update token metadata
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TokenID"
      responses:
        "200":
