            minimum: 1
            default: 1
        - in: query
          name: offset
          schema:
            type: integer
            minimum: 0
        - in: query
          name: unread
          schema:
            type: boolean
      responses:
        "200":
          description: "`notifications`, `unread`, `total`, `page`, `has_more`"
  /api/v1/admin/notifications/read-all:
    post:
      tags: [Observability]
      summary: Mark all notifications read
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
  /api/v1/admin/notifications/{id}/read:
    post:
      tags: [Observability]
      summary: Mark one notification read
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
  /api/v1/admin/events/stream:
    get:
      tags: [Observability]
      summary: Browser event stream backed by native TLS/mTLS gRPC
      description: SSE adapter for RealtimeService.Stream. Events are filtered by current admin role. Send JWT in Authorization header. Reconnect and refresh REST state after disconnection; no replay.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Live events and heartbeat comments
          content:
            text/event-stream:
              schema:
                type: string
        "401":
          description: Invalid or revoked session
        "503":
          description: Native gRPC transport unavailable
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT or sk_test_…
      description: Broker token (`sk_test_…`) or admin JWT from `/api/v1/admin/login`. Paste token only (Swagger adds `Bearer `).
  parameters:
    BrokerID:
      in: path
      name: id
      required: true
      schema:
        type: integer
    TokenID:
      in: path
      name: id
      required: true
      schema:
        type: string
        format: uuid
    OrderID:
      in: path
      name: id
      required: true
      schema:
        type: string
        format: uuid
    AdapterID:
      in: path
      name: id
      required: true
      schema:
        type: string
    ExportJobID:
      in: path
      name: id
      required: true
      schema:
        type: string
        format: uuid
    LogLimit:
      in: query
      name: limit
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    LogCursor:
      in: query
      name: cursor
      schema:
        type: string
    LogKind:
      in: query
      name: kind
      schema:
        type: string
        enum: [all, api, orders, business, errors, auth, fix, system, audit]
  schemas:
    CreateOrderRequest:
      type: object
      required: [account_id, client_code, client_order_id, symbol, board, side, order_type, quantity]
      example:
        account_id: "1-3101-006"
        client_code: "006"
        client_order_id: "TEST0003"
        symbol: "KG0105166315"
        board: "LISTEDSTOCKK"
        side: "BUY"
        order_type: "LIMIT"
        time_in_force: "DAY"
        quantity: "1"
        price: "400"
      properties:
        account_id:
          type: string
          example: "1-3101-006"
          description: "Торговый код счёта. FIX tag 1 Account"
        client_code:
          type: string
          example: "006"
          description: "Произвольный код клиента. FIX tag 109 ClientID"
        client_order_id:
          type: string
          example: "TEST0003"
          description: "Уникальный ID заявки у брокера (идемпотентность). FIX tag 11"
        symbol:
          type: string
          example: "KG0105166315"
          description: "Инструмент (тикер/ISIN). Список — GET /api/v1/instruments"
        board:
          type: string
          example: "LISTEDSTOCKK"
          description: "Код класса (QUIK class code). FIX tag 100 ExDestination"
        side:
          type: string
          enum: [BUY, SELL]
          example: "BUY"
        order_type:
          type: string
          enum: [MARKET, LIMIT]
          example: "LIMIT"
        time_in_force:
          type: string
          enum: [DAY, IOC, FOK, GTC]
          example: "DAY"
          default: "DAY"
        quantity:
          oneOf:
            - type: string
            - type: number
          example: "1"
          description: "Количество (строка или число)"
        price:
          oneOf:
            - type: string
            - type: number
          example: "400"
          description: "Цена для LIMIT (строка или число)"
    CreateTokenRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
        description:
          type: string
        quik_firm:
          type: string
          description: "Код фирмы QUIK → FIX tag 5018 на всех заявках этого токена"
          example: "FREEDOM2003"
        expires_in_days:
          type: integer
          description: "30, 90, 180, 365, or 0 for no expiry. Default 180."
          enum: [0, 30, 90, 180, 365]
        permissions:
          type: array
          items:
            type: string
            enum:
              - "orders:create"
              - "orders:read"
              - "orders:cancel"
              - "orders:replace"
              - "trades:read"
              - "positions:read"
              - "positions:write"
    BrokerAccount:
      type: object
      properties:
        id:
          type: integer
        broker_id:
          type: integer
        code:
          type: string
        name:
          type: string
        quik_firm:
          type: string
        trading_account:
          type: string
          example: "1-3101-2040"
        status:
          type: string
          example: ACTIVE
    Instrument:
      type: object
      properties:
        id:
          type: integer
        internal_symbol:
          type: string
        quik_symbol:
          type: string
          example: KG0105166315
        board:
          type: string
          example: LISTEDSTOCKK
        currency:
          type: string
          example: KZT
        security_type:
          type: string
        status:
          type: string
          example: ACTIVE
    BookLevel:
      type: object
      properties:
        price:
          type: string
          example: "99.5"
        size:
          type: string
          example: "10"
    MarketQuote:
      type: object
      description: Строка текущих торгов; пустая строка цены или статуса означает, что значение ещё не получено
      properties:
        symbol: {type: string}
        security_id: {type: string}
        board: {type: string}
        currency: {type: string}
        name: {type: string}
        trade_date: {type: string}
        trading_status: {type: string, description: Торговый статус FIX 326}
        trading_session_id: {type: string, description: FIX 336}
        trading_session_sub: {type: string, description: FIX 625}
        bid: {type: string}
        bid_size: {type: string}
        offer: {type: string}
        offer_size: {type: string}
        bids:
          type: array
          items:
            $ref: "#/components/schemas/BookLevel"
        offers:
          type: array
          items:
            $ref: "#/components/schemas/BookLevel"
        last: {type: string}
        last_size: {type: string}
        last_time: {type: string}
        open: {type: string}
        high: {type: string}
        low: {type: string}
        close: {type: string}
        wapr: {type: string, description: Средневзвешенная цена}
        settle: {type: string}
        current_price: {type: string}
        official_price: {type: string}
        volume: {type: string}
        value: {type: string, description: Оборот}
        updated_at: {type: string, format: date-time}
    AdminTokenMetadata:
      type: object
      description: API token metadata; full credentials and storage hashes are excluded
      required: [id, broker_id, name, token_prefix, status, permissions, created_at]
      properties:
        id: {type: string, format: uuid}
        broker_id: {type: integer}
        broker_code: {type: string}
        broker_name: {type: string}
        name: {type: string}
        description: {type: string}
        token_prefix: {type: string}
        status: {type: string, enum: [ACTIVE, EXPIRED, REVOKED, DISABLED]}
        permissions: {type: array, items: {type: string}}
        quik_firm: {type: string}
        created_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time, nullable: true}
        revoked_at: {type: string, format: date-time, nullable: true}
        last_used_at: {type: string, format: date-time, nullable: true}
        last_used_ip: {type: string, nullable: true}
        rotated_from: {type: string, format: uuid, nullable: true}
    MarketDataResponse:
      type: object
      required: [quotes]
      properties:
        quotes:
          type: array
          items:
            $ref: "#/components/schemas/MarketQuote"
    RecordedTradeSide:
      type: object
      properties:
        id: {type: string, format: uuid, description: Persisted side UUID}
        ledger_trade_id: {type: string, format: uuid}
        quik_trade_num: {type: string, description: "Exact decimal QUIK trade number, without float conversion"}
        trade_match_id: {type: string}
        execution_date: {type: string, format: date}
        side: {type: string, enum: [BUY, SELL]}
        order_id: {type: string, format: uuid, nullable: true}
        execution_id: {type: string, format: uuid, nullable: true}
        exec_id: {type: string, description: Empty when no FIX execution report was received}
        quik_order_num: {type: string}
        quik_order_id: {type: string, nullable: true}
        client_order_id: {type: string, nullable: true}
        broker_id: {type: integer, nullable: true}
        fix_cl_ord_id: {type: string, nullable: true}
        symbol: {type: string}
        board: {type: string}
        client_code: {type: string}
        quik_firm: {type: string}
        firm_name: {type: string}
        account: {type: string}
        contra_broker: {type: string}
        last_qty: {type: string}
        last_px: {type: string}
        cum_qty: {type: string, nullable: true}
        leaves_qty: {type: string, nullable: true}
        adapter_id: {type: string, nullable: true}
        has_fix_report: {type: boolean}
        has_quik_record: {type: boolean}
        created_at: {type: string, format: date-time}
        received_at: {type: string, format: date-time}
        trade_time_known: {type: boolean}
    Trade:
      type: object
      properties:
        trade_match_id:
          type: string
          description: Exchange matched trade identifier (FIX 880). Distinct from per-order exec_id.
        contra_broker:
          type: string
          description: Counterparty broker from FIX 375, when disclosed.
        contra_trader:
          type: string
          description: Counterparty trader from FIX 337, not a client identifier.
        execution_date:
          type: string
          format: date
          description: FIX trade date, or UTC receipt date for legacy executions.
        id:
          type: string
          format: uuid
        order_id:
          type: string
          format: uuid
        exec_id:
          type: string
        last_qty:
          type: string
        last_px:
          type: string
        cum_qty:
          type: string
        leaves_qty:
          type: string
        client_order_id:
          type: string
        symbol:
          type: string
        board:
          type: string
        side:
          type: string
        client_code:
          type: string
        quik_firm:
          type: string
        created_at:
          type: string
          format: date-time
    Position:
      type: object
      properties:
        kind:
          type: string
          enum: [INSTRUMENT, CASH, FUTURES]
        firm_id:
          type: string
          description: Код фирмы = код брокера (например 2040)
          example: "2040"
        client_code:
          type: string
          example: kalys
        account_code:
          type: string
          example: "1-3101-2040"
        symbol:
          type: string
        security_id:
          type: string
        board:
          type: string
        currency:
          type: string
        pos_type:
          type: string
          description: ML деньги, DL инструмент, FL/FP фьючерсы
          example: DL
        long_qty:
          type: string
        short_qty:
          type: string
        net_qty:
          type: string
        settl_price:
          type: string
        source:
          type: string
          enum: [fix, manual]
          description: fix — из снимка QUIK; manual — задано через API
        keys:
          type: object
          additionalProperties:
            type: string
        items:
          type: object
          additionalProperties:
            type: string
    PositionSnapshot:
      type: object
      properties:
        id:
          type: integer
        adapter_id:
          type: string
          example: quik-fix-1
        pos_req_id:
          type: string
        clearing_date:
          type: string
        requested_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
        status:
          type: string
          example: OK
        report_count:
          type: integer
    PositionsResponse:
      type: object
      properties:
        source:
          type: string
          enum: [fix, manual, mixed]
          example: fix
        firm_id:
          type: string
          description: Код брокера, по которому отфильтрован снимок
          example: "2040"
        snapshot:
          $ref: "#/components/schemas/PositionSnapshot"
        instruments:
          type: array
          items:
            $ref: "#/components/schemas/Position"
        cash:
          type: array
          items:
            $ref: "#/components/schemas/Position"
        note:
          type: string
          description: Пояснение, если снимка ещё нет
    SetCashRequest:
      type: object
      required: [client_code, currency, amount]
      properties:
        firm_id:
          type: string
          description: Код фирмы. У брокера необязателен (берётся из токена).
        broker_id:
          type: integer
          description: Только admin — альтернатива firm_id
        client_code:
          type: string
          example: kalys
        account_code:
          type: string
        currency:
          type: string
          example: KGS
        tag:
          type: string
          description: Ключ денежной позиции (EQTV). Если пусто — currency.
          example: EQTV
        amount:
          oneOf:
            - type: string
            - type: number
          description: CUR_BAL
          example: "1500000"
        open_bal:
          oneOf:
            - type: string
            - type: number
        limit:
          oneOf:
            - type: string
            - type: number
          description: CUR_LIM
        locked:
          oneOf:
            - type: string
            - type: number
    SetInstrumentRequest:
      type: object
      required: [client_code, symbol]
      properties:
        firm_id:
          type: string
        broker_id:
          type: integer
        client_code:
          type: string
        account_code:
          type: string
        symbol:
          type: string
          example: KG0105166315
        security_id:
          type: string
        board:
          type: string
          example: LISTEDSTOCKK
        currency:
          type: string
        quantity:
          oneOf:
            - type: string
            - type: number
          description: Нетто. Если нет — long_qty минус short_qty.
          example: "100"
        long_qty:
          oneOf:
            - type: string
            - type: number
        short_qty:
          oneOf:
            - type: string
            - type: number
        settl_price:
          oneOf:
            - type: string
            - type: number
    SetPositionsRequest:
      type: object
      required: [client_code]
      properties:
        firm_id:
          type: string
        broker_id:
          type: integer
        client_code:
          type: string
        account_code:
          type: string
        cash:
          type: array
          items:
            $ref: "#/components/schemas/SetCashRequest"
        instruments:
          type: array
          items:
            $ref: "#/components/schemas/SetInstrumentRequest"
    SetPositionsResponse:
      type: object
      properties:
        ok:
          type: boolean
        firm_id:
          type: string
        cash:
          type: array
          items:
            $ref: "#/components/schemas/Position"
        instruments:
          type: array
          items:
            $ref: "#/components/schemas/Position"
        result:
          $ref: "#/components/schemas/PositionsResponse"
    EmitentOrdersResponse:
      type: object
      properties:
        symbol:
          type: string
          example: MAIR
        code:
          type: string
          description: emitents.code used to match SecCode[7:10]
          example: "1663"
        count:
          type: integer
          example: 0
        emitent:
          type: object
          properties:
            id:
              type: integer
              format: int64
            name:
              type: string
            name_eng:
              type: string
            code:
              type: string
            symbol:
              type: string
        quotes:
          type: array
          description: QUIK Orders rows plus Securities.SecShortName and SecFullName
          items:
            type: object
            additionalProperties: true
    QuikAPISettings:
      type: object
      properties:
        base_url:
          type: string
          example: "http://192.168.0.89:5000"
        default_base_url:
          type: string
          example: "http://192.168.0.89:5000"
    QuikAPISettingsUpdate:
      type: object
      required: [base_url]
      properties:
        base_url:
          type: string
          description: Origin of the QUIK Module API (scheme + host + optional port)
          example: "http://192.168.0.89:5000"
    QuikAPIQuote:
      type: object
      properties:
        operation:
          type: string
          example: Продажа
        order_num:
          type: string
          example: "1793"
        class_code:
          type: string
          example: LIST_GBA
        sec_code:
          type: string
          example: GBA02280810
        price:
          type: string
          example: "90.00000000"
        value:
          type: string
          example: "90000000.00000000"
        qty:
          type: string
          example: "1000000.00000000"
    QuikAPIQuotesResponse:
      type: object
      properties:
        source:
          type: string
          example: quik_api
        base_url:
          type: string
        count:
          type: integer
        quotes:
          type: array
          items:
            $ref: "#/components/schemas/QuikAPIQuote"

