      responses:
        "200":
          description: OK
    post:
      summary: Create broker
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Created
  /api/v1/admin/brokers/{id}/tokens:
    get:
      summary: List broker API tokens (no secrets)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Token metadata without token or token_hash
    post:
      summary: Create API token (full token returned once)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTokenRequest"
      responses:
        "201":
          description: Created; includes `token` once
  /api/v1/admin/brokers/{id}/security:
    get:
      summary: Broker security dashboard stats
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
  /api/v1/admin/brokers/{id}/ip-whitelist:
    get:
      summary: List IP whitelist entries
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
    post:
      summary: Add IP or CIDR to whitelist
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "201":
          description: Created
  /api/v1/admin/tokens/{id}/revoke:
    post:
      summary: Revoke token (idempotent)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: REVOKED
  /api/v1/admin/tokens/{id}/rotate:
    post:
      summary: Rotate token (old stays ACTIVE; new returned once)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "201":
          description: New token created
  /api/v1/admin/adapters:
    get:
      tags: [Admin]
      summary: List adapters
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
    post:
      tags: [Admin]
      summary: Create adapter
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Created
  /api/v1/admin/orders:
    get:
      summary: List all orders
      security:
