openapi: 3.0.3
info:
  title: Broker FIX Gateway API
  version: 0.4.0
  description: |
    Broker order routing through FIX adapters to QUIK.
    Broker APIs authenticate with long-lived API tokens (`Authorization: Bearer sk_test_…` / `sk_live_…`).
    Admin APIs authenticate with JWT from `POST /api/v1/admin/login`.
    Tokens are stored hashed; the full secret is returned only once at creation/rotation.
servers:
  - url: http://localhost:8080
paths:
  /api/v1/admin/grpc/connections:
    get:
      summary: Active gRPC subscriptions
      description: SUPER_ADMIN, ADMIN, OPERATOR or AUDITOR. Process-local snapshot of authenticated clients and their effective event topics. No credentials are returned. Changes arrive as subscriptions.updated in the admin stream.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: instance_id, revision and connections containing identity, peer, transport, connected_at, topics and data paths.
        "403":
          description: Role cannot view client identities
        "503":
          description: Realtime unavailable
  /api/v1/admin/trading-limits/history:
    get:
      summary: Trading limit changes with before and after values
      description: ADMIN, SUPER_ADMIN, OPERATOR or AUDITOR. Descending ID cursor keeps pages stable while new changes arrive.
      security:
        - bearerAuth: []
      parameters:
        - {in: query, name: broker_id, schema: {type: integer, format: int64, minimum: 0}, description: Zero selects the global policy; omit for all policies}
        - {in: query, name: before_id, schema: {type: integer, format: int64, minimum: 1}}
        - {in: query, name: limit, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
      responses:
        "200":
          description: history containing actor_id, reason, before, after and created_at; next_before_id is null on the final page
        "400":
          description: Invalid filter or cursor
        "403":
          description: Role cannot read audit history
  /api/v1/admin/trading-limits:
    get:
      summary: List global and broker trading limits
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Policies with broker_id, paused, max_quantity, max_open_orders and revision. broker_id=0 applies to every broker; open-order limits are per broker.
    put:
      summary: Update trading limits with an atomic history record
      description: ADMIN or SUPER_ADMIN only. Global and broker policies both apply. Pause blocks new acceptance, keeps cancellations available and does not stop previously accepted orders. Empty limits are null. Existing policies require their current revision; new broker policies use revision=0.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [broker_id, paused, max_quantity, max_open_orders, revision, reason]
              properties:
                broker_id: {type: integer, format: int64, minimum: 0}
                paused: {type: boolean}
                max_quantity: {type: string, nullable: true, description: Positive decimal quantity; maximum 10000000000000000}
                max_open_orders: {type: integer, nullable: true, minimum: 1, maximum: 1000000}
                revision: {type: integer, format: int64, minimum: 0}
                reason: {type: string, minLength: 3, maxLength: 1000}
      responses:
        "200":
          description: Policy and history committed
        "400":
          description: Invalid policy or broker
        "403":
          description: Role cannot modify policies
        "409":
          description: Stale policy revision; reload before saving
  /api/v1/admin/reconciliation:
    get:
      summary: List unresolved FIX outcomes and operator resolution history
      description: Open cases are listed first. Evidence is a persisted applied FIX execution report; SENT or a QUIK order ID alone is insufficient.
      security:
        - bearerAuth: []
      parameters:
        - {in: query, name: order_id, schema: {type: string, format: uuid}}
        - {in: query, name: limit, schema: {type: integer, minimum: 1, maximum: 500, default: 100}}
      responses:
        "200":
          description: Cases with evidence_event_id and optional resolved_at, actor_id and note
        "400":
          description: Invalid filter
  /api/v1/admin/reconciliation/{id}/resolve:
    post:
      summary: Close an uncertain queue outcome using persisted FIX evidence
      description: OPERATOR, ADMIN or SUPER_ADMIN only. Atomically records operator, note, evidence and original error, then completes the queue event. Does not resend or modify the order. Cancel cases require a terminal execution report; cancel rejects need separate investigation.
      security:
        - bearerAuth: []
      parameters:
        - {in: path, name: id, required: true, schema: {type: integer, format: int64, minimum: 1}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [note]
              properties:
                note: {type: string, minLength: 1, maxLength: 2000}
      responses:
        "200":
          description: Resolution committed
        "400":
          description: Invalid ID or note
        "403":
          description: Role cannot resolve cases
        "409":
          description: Case is already closed or conclusive evidence is absent
  /api/v1/admin/execution-inbox:
    get:
      summary: Incoming FIX report queue, the blocking report and quarantine cases
      description: The blocking report is the failed head of the durable inbox; it pauses new trading. Open cases are listed first. Use open=true for open cases only.
      security:
        - bearerAuth: []
      parameters:
        - {in: query, name: open, schema: {type: boolean}}
      responses:
        "200":
          description: status, blocked (or null) and cases
        "503":
          description: Execution inbox is not configured
  /api/v1/admin/execution-inbox/{id}/quarantine:
    post:
      summary: Set the blocking incoming report aside for manual reconciliation
      description: OPERATOR, ADMIN or SUPER_ADMIN only. Records a case with the reason, the report and its error; the inbox then moves the file to quarantine/ without applying it and continues with the next report. Never changes orders or trades.
      security:
        - bearerAuth: []
      parameters:
        - {in: path, name: id, required: true, description: Inbox entry ID, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason: {type: string, minLength: 1, maxLength: 2000}
      responses:
        "202":
          description: Case recorded; the entry is moved aside by the inbox worker
        "400":
          description: Invalid ID or reason
        "403":
          description: Role cannot quarantine
        "409":
          description: Entry is not the report currently blocking the inbox
  /api/v1/admin/execution-inbox/cases/{id}/resolve:
    post:
      summary: Close a quarantine case after manual reconciliation
      description: OPERATOR, ADMIN or SUPER_ADMIN only. Records the outcome; does not replay the report.
      security:
        - bearerAuth: []
      parameters:
        - {in: path, name: id, required: true, description: Inbox entry ID, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [note]
              properties:
                note: {type: string, minLength: 1, maxLength: 2000}
      responses:
        "200":
          description: Case closed
        "400":
          description: Invalid ID or note
        "404":
          description: Case not found
        "409":
          description: Case already closed
  /api/v1/admin/rate-limits:
    get:
      summary: Effective rate limits and per-instance usage
      description: Includes inherited broker category limits. Counters belong to individual admission layers, not final order acceptance.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Explicit policies, effective usage and operation names
    put:
      summary: Configure a rate limit without restarting Gateway
      description: ADMIN or SUPER_ADMIN only. Broker subject is the numeric broker ID. Global and admin subjects are '*'. Changes and their before/after values are audited atomically. Parent limits continue to apply when an operation limit is disabled.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scope, subject, operation, rate, burst, concurrent, enabled, reason]
              properties:
                scope: {type: string, enum: [global, broker, admin]}
                subject: {type: string}
                operation: {type: string}
                rate: {type: integer, minimum: 1, maximum: 1000000}
                burst: {type: integer, minimum: 1, maximum: 1000000}
                concurrent: {type: integer, minimum: 1, maximum: 1000000}
                enabled: {type: boolean}
                reason: {type: string, minLength: 3, maxLength: 1000}
      responses:
        "200": {description: Policy saved and refreshed}
        "400": {description: Invalid policy}
        "403": {description: Administrator role required}
        "503": {description: Policy saved but local refresh is pending}
  /health:
    get:
      summary: Liveness
      responses:
        "200":
          description: OK
  /ready:
    get:
      summary: Readiness
      responses:
        "200":
          description: Ready
        "503":
          description: Not ready
  /metrics:
    get:
      tags: [Ops]
      summary: Prometheus metrics
      responses:
        "200":
          description: Prometheus text exposition
  /api/v1/firm:
    get:
      tags: [Broker]
      summary: Row of QUIK Firms for the token firm
      security:
        - bearerAuth: []
      description: Requires `orders:read`. The quik_export2.public."Firms" row of the token firm (quik_firm, or the broker code when empty), as stored.
      responses:
        "200":
          description: Firms row
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuikFirmRow"
        "404":
          description: Firm not present in Firms
        "503":
          description: QUIK source unavailable
  /api/v1/orders:
    post:
      summary: Create order
      security:
        - bearerAuth: []
      description: |
        Requires permission `orders:create`. broker_id берётся из токена, не из body.

        Поля — имена колонок QUIK `Orders`:
        - `SecCode` → FIX tag **48** SecurityID (`22=8`)
        - `ClassCode` → FIX tag **100** ExDestination
        - `Operation` (`Купля` / `Продажа`) → FIX tag 54
        - `Price` → FIX tag 44; без `Price` — рыночная заявка; срок DAY
        - `Qty` → FIX tag 38
        - `Account` → FIX tag **1**
        - `ClientCode` → FIX tag **109** ClientID
        - `FirmId` → `quik_firm` **API-токена** → FIX tag **5018** (не из body)

        Ответ — заявка в тех же именах плюс `OrderNum`, `State`, `Balance`, `FirmId`, `RejectReason` и `id` шлюза.

        Защита от дублей — необязательный заголовок `Idempotency-Key`.

        Шлюз отправляет заявку в QUIK и отвечает после ответа QUIK (ожидание до `ORDER_ANSWER_TIMEOUT`, 10 с).
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: "Ключ повтора (до 255 символов). Повтор с тем же ключом и параметрами возвращает исходную заявку; без заголовка каждый запрос создаёт новую."
          schema:
            type: string
            maxLength: 255
          example: "TEST0003"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderRequest"
            example:
              ClassCode: "LIST_GBA"
              SecCode: "GBA02270915"
              Operation: "Купля"
              Price: 400
              Qty: 1
              Account: "1-3101-006"
              ClientCode: "006"
      responses:
        "200":
          description: Idempotent existing order, accepted by QUIK
        "201":
          description: Sent to QUIK and accepted (quik_order_id set)
        "202":
          description: QUIK did not answer within ORDER_ANSWER_TIMEOUT (code QUIK_ANSWER_PENDING); the order is live, check GET /api/v1/orders/{id}
        "422":
          description: Rejected by QUIK (code ORDER_REJECTED, reason in error and order.reject_reason) or by gateway risk limits
        "502":
          description: Not delivered to QUIK (code ORDER_FAILED)
        "409":
          description: Idempotency-Key already used with different order parameters (code IDEMPOTENCY_CONFLICT)
        "401":
          description: Unauthorized
        "403":
          description: Forbidden (permissions / IP whitelist)
        "429":
          description: Rate limited
    get:
      summary: List broker orders
      security:
        - bearerAuth: []
      description: Returns a JSON array of original Orders rows, with database column names, numeric JSON values, strings and nulls unchanged. FirmId is restricted by the authenticated token. No derived fields or local/FIX fallback. Pagination is in X-Has-More and X-Next-Offset headers.
      parameters:
        - {in: query, name: limit, schema: {type: integer, minimum: 1, maximum: 1000, default: 200}}
        - {in: query, name: offset, schema: {type: integer, minimum: 0, maximum: 10000000, default: 0}}
      responses:
        "200":
          description: OK
  /api/v1/orders/{id}:
    get:
      summary: Get order
      description: Returns only the original database row, without wrapper, renamed columns, derived values or history. Restricted by authenticated FirmId. URL accepts quik-YYYYMMDD-CLASS-NUMBER or a linked Gateway UUID. Missing row is 404; unavailable source is 503.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
  /api/v1/orders/{id}/cancel:
    post:
      summary: Cancel order
      security:
        - bearerAuth: []
      description: Requires orders:cancel and an active current QUIK Orders row. Accepts a Gateway UUID or QUIK key with a matching original local request. An external order without a local request returns 409. Waits up to ORDER_ANSWER_TIMEOUT for QUIK - 200 cancelled (order in QUIK Orders names, State Снята), 409 CANCEL_REJECTED, 202 QUIK_ANSWER_PENDING.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
  /api/v1/accounts:
    get:
      tags: [Broker]
      summary: Trading accounts of the token firm — rows of QUIK Trdaccs
      security:
        - bearerAuth: []
      description: Requires `orders:read`. JSON array of quik_export2.public."Trdaccs" rows whose FirmId is the token firm, as stored. An order's Account must be the TrdAccId of one of them.
      responses:
        "200":
          description: Trdaccs rows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/QuikTradingAccountRow"
        "503":
          description: QUIK source unavailable
  /api/v1/instruments:
    get:
      tags: [Broker]
      summary: List active instruments
      security:
        - bearerAuth: []
      description: Requires `orders:read`. Use `quik_symbol` + `board` in order create.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  instruments:
                    type: array
                    items:
                      $ref: "#/components/schemas/Instrument"
        "401":
          description: Unauthorized
  /api/v1/market-data:
    get:
      tags: [Broker]
      summary: Current trades — instruments of the chosen QUIK classes
      x-grpc-event: marketdata.tick
      security:
        - bearerAuth: []
      description: |
        Requires `orders:read`. REST source for gRPC `marketdata.tick`. Returns a JSON
        array of instruments of quik_export2.public."Params" with ClassCode, SecCode and
        status (Params), CouponValue, FaceUnit, SecShortName and SecFullName (Securities,
        matched by ClassCode and SecCode) and ClassName (Classes, by ClassCode), as stored:
        numbers as JSON numbers with source precision, strings and nulls; null without a
        reference row. Market data is not firm-scoped. Only rows of the current trading
        day (TradeDate is today in Bishkek, UTC+6) of the classes chosen by a gateway
        administrator (LISTBND by default) are returned; see
        /api/v1/admin/market-data/settings.
        board and symbol filter the ClassCode and SecCode columns; order is ClassCode,
        SecCode. Paging is in X-Has-More and X-Next-Offset. An unavailable source
        returns HTTP 503 with Retry-After; FIX quotes are never substituted.
      parameters:
        - {in: query, name: board, schema: {type: string}, description: ClassCode}
        - {in: query, name: symbol, schema: {type: string}, description: SecCode}
        - {in: query, name: limit, schema: {type: integer, minimum: 1, maximum: 5000, default: 1000}}
        - {in: query, name: offset, schema: {type: integer, minimum: 0, maximum: 10000000, default: 0}}
      responses:
        "200":
          description: Current-trades instruments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MarketDataRow"
        "400":
          description: Invalid limit or offset
        "401":
          description: Unauthorized
        "403":
          description: Missing orders:read or IP not allowed
        "429":
          description: Rate limited
        "503":
          description: Params source or authentication temporarily unavailable, or processing capacity exceeded
  /api/v1/market-data/{board}/{symbol}:
    get:
      tags: [Broker]
      summary: One current-trades instrument by ClassCode and SecCode
      security:
        - bearerAuth: []
      parameters:
        - {in: path, name: board, required: true, schema: {type: string}, description: ClassCode}
        - {in: path, name: symbol, required: true, schema: {type: string}, description: SecCode}
      responses:
        "200":
          description: Instrument
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketDataRow"
        "404":
          description: Instrument not present today or its class is not chosen
        "503":
          description: Params source unavailable
  /api/v1/orderbook:
    get:
      tags: [Broker]
      summary: Live order book per instrument
      security:
        - bearerAuth: []
      description: |
        Requires `orders:read`. Visible bid/offer levels from FIX Market Data (full book).
        Optional `symbol` and `board` filters.
      parameters:
        - in: query
          name: symbol
          schema:
            type: string
        - in: query
          name: board
          schema:
            type: string
      responses:
        "200":
          description: OK
  /api/v1/quotes:
    get:
      tags: [Broker]
      summary: Quotes of one instrument without participants
      security:
        - bearerAuth: []
      description: |
        Requires `orders:read`. Today's (Bishkek, UTC+6) "Активна" Orders rows of every firm for
        one instrument (board = ClassCode and symbol = SecCode are required), reduced to
        side (BUY/SELL), price, quantity (Balance) and volume (price × quantity). Order numbers,
        firms, accounts and client codes are never sent. Newest first; paging is in X-Has-More
        and X-Next-Offset.
      parameters:
        - {in: query, name: board, required: true, schema: {type: string}, description: ClassCode}
        - {in: query, name: symbol, required: true, schema: {type: string}, description: SecCode}
        - {in: query, name: limit, schema: {type: integer, minimum: 1, maximum: 1000, default: 200}}
        - {in: query, name: offset, schema: {type: integer, minimum: 0, maximum: 10000000, default: 0}}
      responses:
        "200":
          description: Quotes
          content:
            application/json:
              example: [{side: SELL, price: 100.5, quantity: 4, volume: 402}]
        "400":
          description: Missing board or symbol, invalid limit or offset
        "401":
          description: Unauthorized
        "503":
          description: QUIK Orders source unavailable
  /api/v1/trades:
    get:
      tags: [Broker]
      summary: List fills of the current broker
      security:
        - bearerAuth: []
      description: Requires `trades:read`. Up to 100 latest executions for this broker.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  trades:
                    type: array
                    items:
                      $ref: "#/components/schemas/Trade"
        "401":
          description: Unauthorized
        "403":
          description: Missing `trades:read`
  /api/v1/positions:
    get:
      tags: [Broker]
      summary: Latest FIX position snapshot for the current broker
      security:
        - bearerAuth: []
      description: |
        Requires `positions:read`.

        Token → broker. Broker `code` (например `2040` у Freedom) — это код фирмы
        в снимке QUIK (колонка «Фирма» / FIX PartyRole 13). Отдаются только позиции
        этой фирмы: инструменты (DL/FP) и деньги (ML). Чужие фирмы не возвращаются.

        Это кэш последнего успешного Request For Positions (`35=AN` → `35=AP`), не live-стрим.
        PUT отправляет Position Maintenance Request (`35=AL`) в QUIK через FIX-адаптер
        и после `35=AM` обновляет снимок через `AN`/`AP`. Если снимка ещё нет,
        `instruments` и `cash` пустые, в `note` будет пояснение.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PositionsResponse"
              example:
                source: fix
                firm_id: "2040"
                snapshot:
                  adapter_id: quik-fix-1
                  pos_req_id: POS963157-296
                  clearing_date: "20260817"
                  status: OK
                  report_count: 6
                instruments:
                  - kind: INSTRUMENT
                    firm_id: "2040"
                    client_code: kalys
                    account_code: "1-3101-2040"
                    symbol: KG0105166315
                    pos_type: DL
                    net_qty: "1000000"
                cash:
                  - kind: CASH
                    firm_id: "2040"
                    client_code: kalys
                    symbol: EQTV
                    pos_type: ML
                    net_qty: "10000000"
        "401":
          description: Unauthorized
        "403":
          description: Missing `positions:read`
  /api/v1/admin/login:
    post:
      summary: Admin login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                password:
                  type: string
      responses:
        "200":
          description: JWT issued
  /api/v1/admin/brokers:
    get:
      summary: List brokers
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
    post:
      summary: Create broker
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Created
  /api/v1/admin/brokers/{id}/tokens:
    get:
      summary: List broker API tokens (no secrets)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Token metadata without token or token_hash
    post:
      summary: Create API token (full token returned once)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTokenRequest"
      responses:
        "201":
          description: Created; includes `token` once
  /api/v1/admin/brokers/{id}/security:
    get:
      summary: Broker security dashboard stats
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
  /api/v1/admin/brokers/{id}/ip-whitelist:
    get:
      summary: List IP whitelist entries
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
    post:
      summary: Add IP or CIDR to whitelist
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "201":
          description: Created
  /api/v1/admin/tokens:
    get:
      tags: [Admin]
      summary: List all API tokens
      description: Flat inventory of tokens across brokers (`broker_id`, `broker_code`, `broker_name`).
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  tokens:
                    type: array
                    items:
                      type: object
  /api/v1/admin/tokens/search:
    post:
      tags: [Admin]
      summary: Find a broker API token
      description: |
        Available to authenticated admin-console users, including read-only roles.
        Accepts the full API token (optionally with Bearer), its UUID, or its exact
        8-character display prefix. Prefixes may match multiple tokens; at most 20
        results are returned. Full credentials match stored current or legacy hashes;
        there is no fallback from an invalid full credential to a prefix match.
        Expired, disabled and revoked tokens remain searchable. The operation does
        not authenticate the supplied token or modify its last-used or stored status.
        Send the credential only in the JSON body. It is not echoed, cached or recorded
        in the audit payload. Responses contain safe metadata and never token hashes.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token]
              properties:
                token: {type: string, minLength: 8, maxLength: 512, format: password, writeOnly: true}
      responses:
        "200":
          description: Matching token metadata; an empty array means no match
          content:
            application/json:
              schema:
                type: object
                required: [tokens, has_more]
                properties:
                  tokens:
                    type: array
                    maxItems: 20
                    items: {$ref: "#/components/schemas/AdminTokenMetadata"}
                  has_more: {type: boolean}
        "400": {description: Invalid search input}
        "401": {description: Admin session required}
        "403": {description: Insufficient role}
        "500": {description: Search unavailable}
