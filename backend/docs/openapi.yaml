  /api/v1/admin/quik-api/settings:
    get:
      tags: [QUIK API]
      summary: QUIK Module API base URL
      description: |
        Returns the origin of the internal QUIK Module API used as a proxy
        (default `http://192.168.0.89:5000`). Operators can change the host from
        the admin UI when the machine address changes.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current origin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuikAPISettings"
              example:
                base_url: "http://192.168.0.89:5000"
                default_base_url: "http://192.168.0.89:5000"
    patch:
      tags: [QUIK API]
      summary: Update QUIK Module API base URL
      description: |
        Persist a new origin (`http://host:port`). Gateway then proxies
        `/api/quotes` and later QUIK Module endpoints from that host.
        Requires operator role or above.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuikAPISettingsUpdate"
            example:
              base_url: "http://192.168.0.89:5000"
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuikAPISettings"
        "400":
          description: Invalid URL (only http/https origins)
  /api/v1/admin/quik-api/quotes:
    get:
      tags: [QUIK API]
      summary: Active QUIK quotes (orders)
      description: |
        Proxies `GET {base_url}/api/quotes` from the internal QUIK Module API.
        Returns only active orders (`State = "Активна"`).
        Fields: operation, order_num, class_code, sec_code, price, value, qty.
        Optional query filters are forwarded upstream.
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: operation
          schema:
            type: string
          description: Купля / Продажа
        - in: query
          name: order_num
          schema:
            type: string
        - in: query
          name: class_code
          schema:
            type: string
          example: LIST_GBA
        - in: query
          name: sec_code
          schema:
            type: string
        - in: query
          name: price
          schema:
            type: string
        - in: query
          name: value
          schema:
            type: string
        - in: query
          name: qty
          schema:
            type: string
      responses:
        "200":
          description: Active quotes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuikAPIQuotesResponse"
              example:
                source: quik_api
                base_url: "http://192.168.0.89:5000"
                count: 1
                quotes:
                  - operation: Продажа
                    order_num: "1793"
                    class_code: LIST_GBA
                    sec_code: GBA02280810
                    price: "90.00000000"
                    value: "90000000.00000000"
                    qty: "1000000.00000000"
        "502":
          description: Upstream QUIK Module API unavailable
