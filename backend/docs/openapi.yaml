openapi: 3.0.3
info:
  title: Broker FIX Gateway API
  version: 0.4.0
  description: |
    Broker order routing through FIX adapters to QUIK.
    Broker APIs authenticate with long-lived API tokens (`Authorization: Bearer sk_test_…` / `sk_live_…`).
    Admin APIs authenticate with JWT from `POST /api/v1/admin/login`.
    Tokens are stored hashed; the full secret is returned only once at creation/rotation.
servers:
  - url: http://localhost:8080
paths:
  /api/v1/admin/grpc/connections:
    get:
      summary: Active gRPC subscriptions
      description: SUPER_ADMIN, ADMIN, OPERATOR or AUDITOR. Process-local snapshot of authenticated clients and their effective event topics. No credentials are returned. Changes arrive as subscriptions.updated in the admin stream.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: instance_id, revision and connections containing identity, peer, transport, connected_at, topics and data paths.
        "403":
          description: Role cannot view client identities
        "503":
          description: Realtime unavailable
  /api/v1/admin/trading-limits/history:
    get:
      summary: Trading limit changes with before and after values
      description: ADMIN, SUPER_ADMIN, OPERATOR or AUDITOR. Descending ID cursor keeps pages stable while new changes arrive.
      security:
        - bearerAuth: []
      parameters:
        - {in: query, name: broker_id, schema: {type: integer, format: int64, minimum: 0}, description: Zero selects the global policy; omit for all policies}
        - {in: query, name: before_id, schema: {type: integer, format: int64, minimum: 1}}
        - {in: query, name: limit, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
      responses:
        "200":
          description: history containing actor_id, reason, before, after and created_at; next_before_id is null on the final page
        "400":
          description: Invalid filter or cursor
        "403":
          description: Role cannot read audit history
  /api/v1/admin/trading-limits:
    get:
      summary: List global and broker trading limits
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Policies with broker_id, paused, max_quantity, max_open_orders and revision. broker_id=0 applies to every broker; open-order limits are per broker.
    put:
      summary: Update trading limits with an atomic history record
      description: ADMIN or SUPER_ADMIN only. Global and broker policies both apply. Pause blocks new acceptance, keeps cancellations available and does not stop previously accepted orders. Empty limits are null. Existing policies require their current revision; new broker policies use revision=0.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [broker_id, paused, max_quantity, max_open_orders, revision, reason]
              properties:
                broker_id: {type: integer, format: int64, minimum: 0}
                paused: {type: boolean}
                max_quantity: {type: string, nullable: true, description: Positive decimal quantity; maximum 10000000000000000}
                max_open_orders: {type: integer, nullable: true, minimum: 1, maximum: 1000000}
                revision: {type: integer, format: int64, minimum: 0}
                reason: {type: string, minLength: 3, maxLength: 1000}
      responses:
        "200":
          description: Policy and history committed
        "400":
          description: Invalid policy or broker
        "403":
          description: Role cannot modify policies
        "409":
          description: Stale policy revision; reload before saving
  /api/v1/admin/reconciliation:
    get:
      summary: List unresolved FIX outcomes and operator resolution history
      description: Open cases are listed first. Evidence is a persisted applied FIX execution report; SENT or a QUIK order ID alone is insufficient.
      security:
        - bearerAuth: []
      parameters:
        - {in: query, name: order_id, schema: {type: string, format: uuid}}
        - {in: query, name: limit, schema: {type: integer, minimum: 1, maximum: 500, default: 100}}
      responses:
        "200":
          description: Cases with evidence_event_id and optional resolved_at, actor_id and note
        "400":
          description: Invalid filter
  /api/v1/admin/reconciliation/{id}/resolve:
    post:
      summary: Close an uncertain queue outcome using persisted FIX evidence
      description: OPERATOR, ADMIN or SUPER_ADMIN only. Atomically records operator, note, evidence and original error, then completes the queue event. Does not resend or modify the order. Cancel cases require a terminal execution report; cancel rejects need separate investigation.
      security:
        - bearerAuth: []
      parameters:
        - {in: path, name: id, required: true, schema: {type: integer, format: int64, minimum: 1}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [note]
              properties:
                note: {type: string, minLength: 1, maxLength: 2000}
      responses:
        "200":
          description: Resolution committed
        "400":
          description: Invalid ID or note
        "403":
          description: Role cannot resolve cases
        "409":
          description: Case is already closed or conclusive evidence is absent
  /api/v1/admin/rate-limits:
    get:
      summary: Effective rate limits and per-instance usage
      description: Includes inherited broker category limits. Counters belong to individual admission layers, not final order acceptance.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Explicit policies, effective usage and operation names
    put:
      summary: Configure a rate limit without restarting Gateway
      description: ADMIN or SUPER_ADMIN only. Broker subject is the numeric broker ID. Global and admin subjects are '*'. Changes and their before/after values are audited atomically. Parent limits continue to apply when an operation limit is disabled.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scope, subject, operation, rate, burst, concurrent, enabled, reason]
              properties:
                scope: {type: string, enum: [global, broker, admin]}
                subject: {type: string}
                operation: {type: string}
                rate: {type: integer, minimum: 1, maximum: 1000000}
                burst: {type: integer, minimum: 1, maximum: 1000000}
                concurrent: {type: integer, minimum: 1, maximum: 1000000}
                enabled: {type: boolean}
                reason: {type: string, minLength: 3, maxLength: 1000}
      responses:
        "200": {description: Policy saved and refreshed}
        "400": {description: Invalid policy}
        "403": {description: Administrator role required}
        "503": {description: Policy saved but local refresh is pending}
  /health:
    get:
      summary: Liveness
      responses:
        "200":
          description: OK
  /ready:
    get:
      summary: Readiness
      responses:
        "200":
          description: Ready
        "503":
          description: Not ready
  /metrics:
    get:
      tags: [Ops]
      summary: Prometheus metrics
      responses:
        "200":
          description: Prometheus text exposition
  /api/v1/firm:
    get:
      summary: Firm for current API token
      security:
        - bearerAuth: []
      description: |
        Returns the firm code bound to the token (`quik_firm` → FIX tag 5018)
        and the firm name from the local `quik_firms` reference cache (if present).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  quik_firm:
                    type: string
                    description: Firm code (FIX 5018)
                    example: "MC0031400000"
                  firm_name:
                    type: string
                    description: Firm name from quik_firms; empty if not in local cache
                    example: "ТОО Example"
        "401":
          description: Unauthorized
  /api/v1/orders:
    post:
      summary: Create order
      security:
        - bearerAuth: []
      description: |
        Requires permission `orders:create`. broker_id берётся из токена, не из body.

        Куда писать поля QUIK/FIX:
        - **Инструмент** → `symbol` (тикер или ISIN) → FIX tag **48** SecurityID (`22=8`)
        - **Код класса** → `board` → FIX tag **100** ExDestination
        - **Валюта** → не в body; `instruments.currency` → FIX tag 15
        - **Торговый счёт** → `account_id` (например `1-3101-006`) → FIX tag **1**
        - **Код клиента** → `client_code` (произвольная строка) → FIX tag **109** ClientID
        - **Код фирмы** → `quik_firm` **API-токена** → FIX tag **5018** (не из body)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderRequest"
            example:
              account_id: "1-3101-006"
              client_code: "006"
              client_order_id: "TEST0003"
              symbol: "KG0105166315"
              board: "LISTEDSTOCKK"
              side: "BUY"
              order_type: "LIMIT"
              time_in_force: "DAY"
              quantity: "1"
              price: "400"
      responses:
        "200":
          description: Idempotent existing order
        "201":
          description: Created
        "401":
          description: Unauthorized
        "403":
          description: Forbidden (permissions / IP whitelist)
        "429":
          description: Rate limited
    get:
      summary: List broker orders
      security:
        - bearerAuth: []
      description: Requires `orders:read`
      responses:
        "200":
          description: OK
  /api/v1/orders/{id}:
    get:
      summary: Get order
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
  /api/v1/orders/{id}/cancel:
    post:
      summary: Cancel order
      security:
        - bearerAuth: []
      description: Requires `orders:cancel`
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
  /api/v1/accounts:
    get:
      tags: [Broker]
      summary: List accounts of the current broker
      security:
        - bearerAuth: []
      description: Requires `orders:read`. Accounts belong to the broker bound to the token.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  accounts:
                    type: array
                    items:
                      $ref: "#/components/schemas/BrokerAccount"
        "401":
          description: Unauthorized
  /api/v1/instruments:
    get:
      tags: [Broker]
      summary: List active instruments
      security:
        - bearerAuth: []
      description: Requires `orders:read`. Use `quik_symbol` + `board` in order create.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  instruments:
                    type: array
                    items:
                      $ref: "#/components/schemas/Instrument"
        "401":
          description: Unauthorized
  /api/v1/market-data:
    get:
      tags: [Broker]
      summary: Full current market data snapshot
      x-grpc-event: marketdata.tick
      security:
        - bearerAuth: []
      description: |
        Requires `orders:read`. REST source for gRPC `marketdata.tick`: the same
        quote fields (book, OHLC, volume, turnover, trading status and update time).
        Adapter IDs, FIX request IDs, raw FIX fields and internal subscription state
        are omitted. Decimal values are strings.
        Without filters returns all subscribed instruments. Optional symbol (ticker
        or SecurityID) and board filters affect this response only. A successful
        GET always returns a complete selection in quotes, without source, live,
        replace or subscription fields. An unavailable feed returns HTTP 503 with
        Retry-After; no matching quotes in an available feed returns quotes=[].
        updated_at is the quote's receipt time; feed connectivity alone does not
        guarantee freshness or completeness of an individual quote.
      parameters:
        - in: query
          name: symbol
          schema: {type: string}
        - in: query
          name: board
          schema: {type: string}
      responses:
        "200":
          description: Current snapshot; quotes is empty when no instrument in the available feed matches
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketDataResponse"
        "401":
          description: Unauthorized
        "403":
          description: Missing orders:read or IP not allowed
        "429":
          description: Rate limited
        "503":
          description: Market data or authentication temporarily unavailable, or processing capacity exceeded
  /api/v1/orderbook:
    get:
      tags: [Broker]
      summary: Live order book per instrument
      security:
        - bearerAuth: []
      description: |
        Requires `orders:read`. Visible bid/offer levels from FIX Market Data (full book).
        Optional `symbol` and `board` filters.
      parameters:
        - in: query
          name: symbol
          schema:
            type: string
        - in: query
          name: board
          schema:
            type: string
      responses:
        "200":
          description: OK
  /api/v1/trades:
    get:
      tags: [Broker]
      summary: List fills of the current broker
      security:
        - bearerAuth: []
      description: Requires `trades:read`. Up to 100 latest executions for this broker.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  trades:
                    type: array
                    items:
                      $ref: "#/components/schemas/Trade"
        "401":
          description: Unauthorized
        "403":
          description: Missing `trades:read`
  /api/v1/positions:
    get:
      tags: [Broker]
      summary: Latest FIX position snapshot for the current broker
      security:
        - bearerAuth: []
      description: |
        Requires `positions:read`.

        Token → broker. Broker `code` (например `2040` у Freedom) — это код фирмы
        в снимке QUIK (колонка «Фирма» / FIX PartyRole 13). Отдаются только позиции
        этой фирмы: инструменты (DL/FP) и деньги (ML). Чужие фирмы не возвращаются.

        Это кэш последнего успешного Request For Positions (`35=AN` → `35=AP`), не live-стрим.
        PUT отправляет Position Maintenance Request (`35=AL`) в QUIK через FIX-адаптер
        и после `35=AM` обновляет снимок через `AN`/`AP`. Если снимка ещё нет,
        `instruments` и `cash` пустые, в `note` будет пояснение.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PositionsResponse"
              example:
                source: fix
                firm_id: "2040"
                snapshot:
                  adapter_id: quik-fix-1
                  pos_req_id: POS963157-296
                  clearing_date: "20260817"
                  status: OK
                  report_count: 6
                instruments:
                  - kind: INSTRUMENT
                    firm_id: "2040"
                    client_code: kalys
                    account_code: "1-3101-2040"
                    symbol: KG0105166315
                    pos_type: DL
                    net_qty: "1000000"
                cash:
                  - kind: CASH
                    firm_id: "2040"
                    client_code: kalys
                    symbol: EQTV
                    pos_type: ML
                    net_qty: "10000000"
        "401":
          description: Unauthorized
        "403":
          description: Missing `positions:read`
    put:
      tags: [Broker]
      summary: Set cash and/or securities positions
      security:
        - bearerAuth: []
      description: |
        Requires `positions:write`.

        Отправляет в QUIK Position Maintenance Request (`35=AL`, PosTransType=3,
        PosMaintAction=2 Replace) с блоками ML (деньги) и/или DL (бумаги)
        в разметке ARQA §2.33 (PosKey 5026/5027, PosItem 5029/5030).
        Дожидается `35=AM` и обновляет снимок через `35=AN`/`35=AP`.
        Фирма берётся из кода брокера.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetPositionsRequest"
            example:
              client_code: kalys
              account_code: "1-3101-2040"
              cash:
                - currency: KGS
                  client_code: kalys
                  amount: "1500000"
                  tag: EQTV
              instruments:
                - symbol: KG0105166315
                  client_code: kalys
                  board: LISTEDSTOCKK
                  quantity: "100"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetPositionsResponse"
        "400":
          description: Validation error
        "401":
          description: Unauthorized
        "403":
          description: Missing `positions:write`
  /api/v1/positions/cash:
    put:
      tags: [Broker]
      summary: Set a cash (money) position
      security:
        - bearerAuth: []
      description: Requires `positions:write`. Отправляет в QUIK `35=AL` (ML / CUR_BAL).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetCashRequest"
            example:
              client_code: kalys
              currency: KGS
              amount: "1500000"
              tag: EQTV
      responses:
        "200":
          description: OK
        "400":
          description: Validation error
        "401":
          description: Unauthorized
        "403":
          description: Missing `positions:write`
    delete:
      tags: [Broker]
      summary: Delete a cash position in QUIK
      security:
        - bearerAuth: []
      description: Requires `positions:write`. `35=AL` PosMaintAction=3 Cancel, PosUpdateAction=2 Delete.
      parameters:
        - in: query
          name: client_code
          required: true
          schema:
            type: string
        - in: query
          name: currency
          required: true
          schema:
            type: string
        - in: query
          name: tag
          schema:
            type: string
      responses:
        "200":
          description: Cleared
        "404":
          description: Position not found
  /api/v1/positions/instruments:
    put:
      tags: [Broker]
      summary: Set a securities position
      security:
        - bearerAuth: []
      description: Requires `positions:write`. Отправляет в QUIK `35=AL` (DL / CUR_BAL).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetInstrumentRequest"
            example:
              client_code: kalys
              symbol: KG0105166315
              board: LISTEDSTOCKK
              quantity: "100"
      responses:
        "200":
          description: OK
        "400":
          description: Validation error
        "401":
          description: Unauthorized
        "403":
          description: Missing `positions:write`
    delete:
      tags: [Broker]
      summary: Delete a securities position in QUIK
      security:
        - bearerAuth: []
      description: Requires `positions:write`. `35=AL` Cancel/Delete в QUIK.
      parameters:
        - in: query
          name: client_code
          required: true
          schema:
            type: string
        - in: query
          name: symbol
          required: true
          schema:
            type: string
        - in: query
          name: board
          schema:
            type: string
      responses:
        "200":
          description: Cleared
        "404":
          description: Position not found
  /api/v1/admin/login:
    post:
      summary: Admin login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                password:
                  type: string
      responses:
        "200":
          description: JWT issued
  /api/v1/admin/brokers:
    get:
      summary: List brokers
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
    post:
      summary: Create broker
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Created
  /api/v1/admin/brokers/{id}/tokens:
    get:
      summary: List broker API tokens (no secrets)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Token metadata without token or token_hash
    post:
      summary: Create API token (full token returned once)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTokenRequest"
      responses:
        "201":
          description: Created; includes `token` once
  /api/v1/admin/brokers/{id}/security:
    get:
      summary: Broker security dashboard stats
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
  /api/v1/admin/brokers/{id}/ip-whitelist:
    get:
      summary: List IP whitelist entries
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
    post:
      summary: Add IP or CIDR to whitelist
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "201":
          description: Created
  /api/v1/admin/tokens:
    get:
      tags: [Admin]
      summary: List all API tokens
      description: Flat inventory of tokens across brokers (`broker_id`, `broker_code`, `broker_name`).
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  tokens:
                    type: array
                    items:
                      type: object
  /api/v1/admin/tokens/search:
    post:
      tags: [Admin]
      summary: Find a broker API token
      description: |
        Available to authenticated admin-console users, including read-only roles.
        Accepts the full API token (optionally with Bearer), its UUID, or its exact
        8-character display prefix. Prefixes may match multiple tokens; at most 20
        results are returned. Full credentials match stored current or legacy hashes;
        there is no fallback from an invalid full credential to a prefix match.
        Expired, disabled and revoked tokens remain searchable. The operation does
        not authenticate the supplied token or modify its last-used or stored status.
        Send the credential only in the JSON body. It is not echoed, cached or recorded
        in the audit payload. Responses contain safe metadata and never token hashes.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token]
              properties:
                token: {type: string, minLength: 8, maxLength: 512, format: password, writeOnly: true}
      responses:
        "200":
          description: Matching token metadata; an empty array means no match
          content:
            application/json:
              schema:
                type: object
                required: [tokens, has_more]
                properties:
                  tokens:
                    type: array
                    maxItems: 20
                    items: {$ref: "#/components/schemas/AdminTokenMetadata"}
                  has_more: {type: boolean}
        "400": {description: Invalid search input}
        "401": {description: Admin session required}
        "403": {description: Insufficient role}
        "500": {description: Search unavailable}
  /api/v1/admin/tokens/{id}/revoke:
    post:
      summary: Revoke token (idempotent)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: REVOKED
  /api/v1/admin/tokens/{id}/rotate:
    post:
      summary: Rotate token (old stays ACTIVE; new returned once)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "201":
          description: New token created
  /api/v1/admin/adapters:
    get:
      tags: [Admin]
      summary: List adapters
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
    post:
      tags: [Admin]
      summary: Create adapter
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Created
  /api/v1/admin/orders:
    get:
      summary: List all orders
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
  /api/v1/admin/emitents/{symbol}/orders:
    get:
      tags: [Admin]
      summary: QUIK Quotes by emitent trading symbol
      description: |
        Takes a 4-character trading symbol, looks it up in `emitents.symbol`,
        reads `emitents.code` (4 chars), then returns rows from QUIK `"Orders"`
        where characters 7–10 of `SecCode` equal that code
        (`substring(SecCode from 7 for 4)`), joined with `"Securities"` for
        `SecShortName` and `SecFullName`.

        Calls PostgreSQL function `"Quotes"` on the QUIK export database:
        `SELECT * FROM public."Quotes"('MAIR')`.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: symbol
          required: true
          schema:
            type: string
            minLength: 4
            maxLength: 4
            example: MAIR
          description: Trading symbol, exactly 4 characters
      responses:
        "200":
          description: Emitent found; `quotes` may be empty
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmitentOrdersResponse"
              example:
                symbol: MAIR
                code: "1663"
                count: 0
                emitent:
                  id: 344
                  name: ОАО Аэропорты Кыргызстана
                  name_eng: ""
                  code: "1663"
                  symbol: MAIR
                quotes: []
        "400":
          description: Symbol is not exactly 4 characters
        "401":
          description: Unauthorized
        "404":
          description: Emitent with this symbol not found
        "503":
          description: QUIK export database is not configured
  /api/v1/admin/trades:
    get:
      summary: List recorded QUIK trades and both persisted sides
      description: Returns all persisted sides of the latest 500 exchange trades, ordered by trade date and numeric QUIK trade number. Uses trades/trade_sides, with immutable FIX and QUIK source evidence in trade_reports. No inferred counterparty rows. A side need not have a local Gateway order or ExecID. Coverage describes the entire ledger and the latest read-only QUIK reconciliation. Broker endpoints still return only their local order executions.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Latest 500 exchange trades with all persisted sides and global coverage
          content:
            application/json:
              schema:
                type: object
                properties:
                  trades:
                    type: array
                    items:
                      $ref: "#/components/schemas/RecordedTradeSide"
                  coverage:
                    type: object
                    properties:
                      trades: {type: integer}
                      sides: {type: integer}
                      complete: {type: integer}
                      incomplete: {type: integer}
                      report_errors: {type: integer}
                      last_sync_at: {type: string, format: date-time, nullable: true}
                      last_sync_records: {type: integer, nullable: true}
                      last_sync_error: {type: string, nullable: true}
                      sync_running: {type: boolean}
