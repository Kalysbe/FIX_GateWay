            format: uuid
      responses:
        "200":
          description: OK
  /api/v1/admin/ws:
    get:
      tags: [Observability]
      summary: Admin WebSocket (query token=JWT)
      description: Real-time `obs.event`, `notification.new`, `order.updated`, `adapter.status_changed`.
      parameters:
        - in: query
          name: token
          required: true
          schema:
            type: string
      responses:
        "101":
          description: Switching Protocols
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT or sk_test_…
      description: Broker token (`sk_test_…`) or admin JWT from `/api/v1/admin/login`. Paste token only (Swagger adds `Bearer `).
  parameters:
    BrokerID:
      in: path
      name: id
      required: true
      schema:
        type: integer
    TokenID:
      in: path
      name: id
      required: true
      schema:
        type: string
        format: uuid
    OrderID:
      in: path
      name: id
      required: true
      schema:
        type: string
        format: uuid
    AdapterID:
      in: path
      name: id
      required: true
      schema:
        type: string
    ExportJobID:
      in: path
      name: id
      required: true
      schema:
        type: string
        format: uuid
    LogLimit:
      in: query
      name: limit
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 20
    LogCursor:
      in: query
      name: cursor
      schema:
        type: string
    LogKind:
      in: query
      name: kind
      schema:
        type: string
        enum: [all, api, orders, business, errors, auth, fix, system, audit]
  schemas:
    CreateOrderRequest:
      type: object
      required: [account_id, client_code, client_order_id, symbol, board, side, order_type, quantity]
      example:
        account_id: "1-3101-006"
        client_code: "006"
        client_order_id: "TEST0003"
        symbol: "KG0105166315"
        board: "LISTEDSTOCKK"
        side: "BUY"
        order_type: "LIMIT"
        time_in_force: "DAY"
        quantity: "1"
        price: "400"
      properties:
        account_id:
          type: string
          example: "1-3101-006"
          description: "Торговый код счёта. FIX tag 1 Account"
        client_code:
          type: string
          example: "006"
          description: "Произвольный код клиента. FIX tag 109 ClientID"
        client_order_id:
          type: string
          example: "TEST0003"
          description: "Уникальный ID заявки у брокера (идемпотентность). FIX tag 11"
        symbol:
          type: string
          example: "KG0105166315"
          description: "Инструмент (тикер/ISIN). Список — GET /api/v1/instruments"
        board:
          type: string
          example: "LISTEDSTOCKK"
          description: "Код класса (QUIK class code). FIX tag 100 ExDestination"
        side:
          type: string
          enum: [BUY, SELL]
          example: "BUY"
        order_type:
          type: string
          enum: [MARKET, LIMIT]
          example: "LIMIT"
        time_in_force:
          type: string
          enum: [DAY, IOC, FOK, GTC]
          example: "DAY"
          default: "DAY"
        quantity:
          oneOf:
            - type: string
            - type: number
          example: "1"
          description: "Количество (строка или число)"
        price:
          oneOf:
            - type: string
            - type: number
          example: "400"
          description: "Цена для LIMIT (строка или число)"
    CreateTokenRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
        description:
          type: string
        quik_firm:
          type: string
          description: "Код фирмы QUIK → FIX tag 5018 на всех заявках этого токена"
          example: "FREEDOM2003"
        expires_in_days:
          type: integer
          description: "30, 90, 180, 365, or 0 for no expiry. Default 180."
          enum: [0, 30, 90, 180, 365]
        permissions:
          type: array
          items:
            type: string
            enum:
              - "orders:create"
              - "orders:read"
              - "orders:cancel"
              - "orders:replace"
              - "trades:read"
              - "positions:read"
    BrokerAccount:
      type: object
      properties:
        id:
          type: integer
        broker_id:
          type: integer
        code:
          type: string
        name:
          type: string
        quik_firm:
          type: string
        trading_account:
          type: string
          example: "1-3101-2040"
        status:
          type: string
          example: ACTIVE
    Instrument:
      type: object
      properties:
        id:
          type: integer
        internal_symbol:
          type: string
        quik_symbol:
          type: string
          example: KG0105166315
        board:
          type: string
          example: LISTEDSTOCKK
        currency:
          type: string
          example: KZT
        security_type:
          type: string
        status:
          type: string
          example: ACTIVE
    Trade:
      type: object
      properties:
        id:
          type: string
          format: uuid
        order_id:
          type: string
          format: uuid
        exec_id:
          type: string
        last_qty:
          type: string
        last_px:
          type: string
        cum_qty:
          type: string
        leaves_qty:
          type: string
        client_order_id:
          type: string
        symbol:
          type: string
        board:
          type: string
        side:
          type: string
        client_code:
          type: string
        quik_firm:
          type: string
        created_at:
          type: string
          format: date-time
    Position:
      type: object
      properties:
        kind:
          type: string
          enum: [INSTRUMENT, CASH, FUTURES]
        firm_id:
          type: string
          description: Код фирмы = код брокера (например 2040)
          example: "2040"
        client_code:
          type: string
          example: kalys
        account_code:
          type: string
          example: "1-3101-2040"
        symbol:
          type: string
        security_id:
          type: string
        board:
          type: string
        currency:
          type: string
        pos_type:
          type: string
          description: ML деньги, DL инструмент, FL/FP фьючерсы
          example: DL
        long_qty:
          type: string
        short_qty:
          type: string
        net_qty:
          type: string
        settl_price:
          type: string
        keys:
          type: object
          additionalProperties:
            type: string
        items:
          type: object
          additionalProperties:
            type: string
    PositionSnapshot:
      type: object
      properties:
        id:
          type: integer
        adapter_id:
          type: string
          example: quik-fix-1
        pos_req_id:
          type: string
        clearing_date:
          type: string
        requested_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
        status:
          type: string
          example: OK
        report_count:
          type: integer
    PositionsResponse:
      type: object
      properties:
        source:
          type: string
          example: fix
        firm_id:
          type: string
          description: Код брокера, по которому отфильтрован снимок
          example: "2040"
        snapshot:
          $ref: "#/components/schemas/PositionSnapshot"
        instruments:
          type: array
          items:
            $ref: "#/components/schemas/Position"
        cash:
          type: array
          items:
            $ref: "#/components/schemas/Position"
        note:
          type: string
          description: Пояснение, если снимка ещё нет
    EmitentOrdersResponse:
      type: object
      properties:
        symbol:
          type: string
          example: MAIR
        code:
          type: string
          description: emitents.code used to match SecCode[7:10]
          example: "1663"
        count:
          type: integer
          example: 0
        emitent:
          type: object
          properties:
            id:
              type: integer
              format: int64
            name:
              type: string
            name_eng:
              type: string
            code:
              type: string
            symbol:
              type: string
        quotes:
          type: array
          description: QUIK Orders rows plus Securities.SecShortName and SecFullName
          items:
            type: object
            additionalProperties: true

