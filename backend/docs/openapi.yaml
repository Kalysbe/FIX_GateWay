      tags: [Admin]
      summary: One current-trades instrument by ClassCode and SecCode
      security:
        - bearerAuth: []
      parameters:
        - {in: path, name: board, required: true, schema: {type: string}}
        - {in: path, name: symbol, required: true, schema: {type: string}}
      responses:
