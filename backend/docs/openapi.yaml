  /api/v1/admin/positions:
    get:
      tags: [Admin]
      description: |
        Positions are obtained by a gateway-owned FIX subscription independently
        of the browser and filters. The subscription object includes status,
        adapter_id, pos_req_id, mode (stream or snapshot), positions, error,
        next_retry_at and last_received_at. Until the stream is confirmed,
        complete snapshots are requested automatically every 30 seconds.
        The live flag is true only when the saved complete snapshot belongs to
        the current ACTIVE automatic source. During recovery the previous
        complete snapshot remains available with live=false.
      summary: Latest FIX position snapshot
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: firm_id
          schema:
            type: string
        - in: query
          name: broker_id
          schema:
            type: integer
      responses:
        "200":
          description: OK
    put:
      tags: [Admin]
      summary: Set cash and/or securities positions
      security:
        - bearerAuth: []
      description: |
        SUPER_ADMIN / ADMIN. Отправляет `35=AL` в QUIK через FIX-адаптер и обновляет снимок `AN`/`AP`.
        Фирма задаётся через `firm_id` или `broker_id`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetPositionsRequest"
      responses:
        "200":
          description: OK
        "400":
          description: Validation error
  /api/v1/admin/positions/cash:
    put:
      tags: [Admin]
      summary: Set a cash (money) position
      security:
        - bearerAuth: []
      requestBody:
