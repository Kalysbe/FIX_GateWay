      description: |
        The gateway maintains FIX subscriptions continuously, independently of
        browser sessions. The subscription object includes status, adapter_id,
        expected, confirmed, error, next_retry_at and last_received_at. Dictionary
        placeholders do not count as received data. The live flag is true for
        ACTIVE or PARTIAL subscriptions only.
