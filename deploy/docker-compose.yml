services:
  # Development only. Replace this PKI with your organisation's CA in production.
  devcerts:
    build:
      context: ../backend
      dockerfile: Dockerfile
      target: devcerts
    command: ["-out", "/certs"]
    volumes:
      - grpc-certs:/certs
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: gateway
      POSTGRES_DB: fix_gateway
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway -d fix_gateway"]
      interval: 5s
      timeout: 5s
      retries: 10

  fixsimulator:
    build:
      context: ../backend
      dockerfile: Dockerfile
      target: fixsimulator
    restart: unless-stopped
    ports:
      - "127.0.0.1:5001:5001"
      - "127.0.0.1:5002:5002"

  gateway:
    build:
      context: ../backend
      dockerfile: Dockerfile
      target: gateway
    restart: unless-stopped
    depends_on:
      devcerts:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      fixsimulator:
        condition: service_started
    environment:
      HTTP_ADDR: ":8080"
      PROMETHEUS_URL: ${PROMETHEUS_URL:-http://prometheus:9090}
      API_READ_CONCURRENCY: ${API_READ_CONCURRENCY:-32}
      API_TRADE_CONCURRENCY: ${API_TRADE_CONCURRENCY:-16}
      API_REQUEST_TIMEOUT: ${API_REQUEST_TIMEOUT:-15s}
      RATE_LIMIT_MAX_STATES: ${RATE_LIMIT_MAX_STATES:-100000}
      GRPC_ADDR: ":8443"
      GRPC_TLS_CERT: /certs/server.crt
      GRPC_TLS_KEY: /certs/server.key
      GRPC_TLS_CA: /certs/ca.crt
      GRPC_MTLS_REQUIRED: "true"
      GRPC_CLIENT_CERT: /certs/bridge.crt
      GRPC_CLIENT_KEY: /certs/bridge.key
      GRPC_TARGET: localhost:8443
      GRPC_SERVER_NAME: localhost
      DATABASE_URL: postgres://gateway:gateway@postgres:5432/fix_gateway?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-me}
      API_TOKEN_PEPPER: ${API_TOKEN_PEPPER:-dev-token-pepper-change-me}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@localhost}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      LB_STRATEGY: ${LB_STRATEGY:-least_connections}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:3000,http://localhost:5174}
      MIGRATIONS_PATH: /app/migrations
      FIX_SESSION_DIR: /app/fix-sessions
      WORKER_ID: gateway-1
      APP_ENV: ${APP_ENV:-development}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      REQUIRE_HTTPS: ${REQUIRE_HTTPS:-false}
      # Seeded adapters use host "fixsimulator" — works on the compose network.
      ADAPTER_HOST_OVERRIDE: ${ADAPTER_HOST_OVERRIDE:-}
      MARKET_DATA_BOARDS: ${MARKET_DATA_BOARDS:-LISTEDSTOCKK,LIST_GBA}
      QUIK_API_BASE_URL: ${QUIK_API_BASE_URL:-http://192.168.0.89:5000}
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:8443:8443"
    volumes:
      - grpc-certs:/certs:ro
      - fix-sessions:/app/fix-sessions
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ""
    restart: unless-stopped
    depends_on:
      gateway:
        condition: service_healthy
    ports:
      - "127.0.0.1:5173:80"

  prometheus:
    image: prom/prometheus:v2.54.1
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
      - ./prometheus/rate-limits.rules.yml:/etc/prometheus/rate-limits.rules.yml:ro
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      gateway:
        condition: service_healthy

volumes:
  fix-sessions:
  prometheus-data:
  pgdata:
  grpc-certs:
