services:
  # Development only. Replace this PKI with your organisation's CA in production.
  devcerts:
    build:
      context: ../backend
      dockerfile: Dockerfile
      target: devcerts
    command: ["-out", "/certs"]
    volumes:
      - grpc-certs:/certs
  postgres:
    image: postgres:16.15-alpine3.24@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    restart: unless-stopped
    environment:
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: gateway
      POSTGRES_DB: fix_gateway
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway -d fix_gateway"]
      interval: 5s
      timeout: 5s
      retries: 10

  # The gateway talks to the real QUIK FIX adapters (quik-fix-1, quik-fix-2);
  # the FIX simulator lives only in docker-compose.local.yml.
  gateway:
    build:
      context: ../backend
      dockerfile: Dockerfile
      target: gateway
    restart: unless-stopped
    # Shutdown drains HTTP for up to 5s, then the FIX sessions send Logout;
    # the default 10s would kill the gateway before Logout goes out.
    stop_grace_period: 30s
    depends_on:
      devcerts:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment:
      HTTP_ADDR: ":8080"
      PROMETHEUS_URL: ${PROMETHEUS_URL:-http://prometheus:9090}
      API_READ_CONCURRENCY: ${API_READ_CONCURRENCY:-32}
      API_TRADE_CONCURRENCY: ${API_TRADE_CONCURRENCY:-16}
      API_REQUEST_TIMEOUT: ${API_REQUEST_TIMEOUT:-15s}
      ORDER_ANSWER_TIMEOUT: ${ORDER_ANSWER_TIMEOUT:-10s}
      HTTP_WRITE_TIMEOUT: ${HTTP_WRITE_TIMEOUT:-60s}
      RATE_LIMIT_MAX_STATES: ${RATE_LIMIT_MAX_STATES:-100000}
      GRPC_ADDR: ":8443"
      GRPC_TLS_CERT: /certs/server.crt
      GRPC_TLS_KEY: /certs/server.key
      GRPC_TLS_CA: /certs/ca.crt
      GRPC_MTLS_REQUIRED: ${GRPC_MTLS_REQUIRED:-false}
      GRPC_CLIENT_CERT: ${GRPC_CLIENT_CERT:-}
      GRPC_CLIENT_KEY: ${GRPC_CLIENT_KEY:-}
      GRPC_TARGET: localhost:8443
      GRPC_SERVER_NAME: localhost
      DATABASE_URL: postgres://gateway:gateway@postgres:5432/fix_gateway?sslmode=disable
      QUIK_EXPORT_DATABASE_URL: ${QUIK_EXPORT_DATABASE_URL:-}
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-me}
      API_TOKEN_PEPPER: ${API_TOKEN_PEPPER:-dev-token-pepper-change-me}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@localhost}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      LB_STRATEGY: ${LB_STRATEGY:-least_connections}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:3000}
      MIGRATIONS_PATH: /app/migrations
      FIX_SESSION_DIR: /app/fix-sessions
      FIX_AUDIT_MAX_BYTES: ${FIX_AUDIT_MAX_BYTES:-4294967296}
      WORKER_ID: gateway-1

      APP_ENV: ${APP_ENV:-development}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      REQUIRE_HTTPS: ${REQUIRE_HTTPS:-false}
      HMAC_REQUIRED: ${HMAC_REQUIRED:-false}
      OPERATIONS_ADDR: ":9080"
      # QUIK is 172.23.10.84; the server DB has only quik-fix-1 and quik-fix-2
      # (simulator rows removed 06.11.2026).
      ADAPTER_HOST_OVERRIDE: ${ADAPTER_HOST_OVERRIDE:-}
      # The QUIK FIX adapters work 09:05-04:00 Bishkek; the gateway connects
      # only then and logs out at 03:59.
      FIX_SESSION_HOURS: ${FIX_SESSION_HOURS-09:05-03:59}
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:8443:8443"
    volumes:
      - grpc-certs:/certs:ro
      - fix-sessions:/app/fix-sessions
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ""
    restart: unless-stopped
    depends_on:
      gateway:
        condition: service_healthy
    ports:
      - "127.0.0.1:5173:8080"

  prometheus:
    image: prom/prometheus:v3.13.4@sha256:87861b8cf91579109319ebc300f3f1060e6da9c05d6ae8ad15a20c879e84e32e
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
      - ./prometheus/rate-limits.rules.yml:/etc/prometheus/rate-limits.rules.yml:ro
      - ./prometheus/trades.rules.yml:/etc/prometheus/trades.rules.yml:ro
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      gateway:
        condition: service_healthy

volumes:
  fix-sessions:
  prometheus-data:
  pgdata:
  grpc-certs:
