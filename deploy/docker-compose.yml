services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: gateway
      POSTGRES_DB: fix_gateway
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway -d fix_gateway"]
      interval: 5s
      timeout: 5s
      retries: 10

  fixsimulator:
    build:
      context: ../backend
      dockerfile: Dockerfile
      target: fixsimulator
    restart: unless-stopped
    ports:
      - "5001:5001"
      - "5002:5002"

  gateway:
    build:
      context: ../backend
      dockerfile: Dockerfile
      target: gateway
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      fixsimulator:
        condition: service_started
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://gateway:gateway@postgres:5432/fix_gateway?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-me}
      API_TOKEN_PEPPER: ${API_TOKEN_PEPPER:-dev-token-pepper-change-me}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@localhost}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      LB_STRATEGY: ${LB_STRATEGY:-least_connections}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:3000}
      MIGRATIONS_PATH: /app/migrations
      WORKER_ID: gateway-1
      APP_ENV: ${APP_ENV:-development}
      # Seeded adapters use host "fixsimulator" — works on the compose network.
      ADAPTER_HOST_OVERRIDE: ${ADAPTER_HOST_OVERRIDE:-}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ""
    restart: unless-stopped
    depends_on:
      gateway:
        condition: service_healthy
    ports:
      - "5173:80"

  prometheus:
    image: prom/prometheus:v2.54.1
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      gateway:
        condition: service_healthy

volumes:
  pgdata:
