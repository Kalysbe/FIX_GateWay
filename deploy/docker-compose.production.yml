name: fix-gateway-production

# Standalone production manifest. Do not merge with development/simulator files.
# External PostgreSQL must use verified TLS. Operator PKI and UAT evidence required.
services:
  gateway:
    build:
      context: ../backend
      target: gateway
    container_name: ${GATEWAY_CONTAINER_NAME:-fix-gateway-production-gateway}
    restart: unless-stopped
    init: true
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    mem_limit: 2g
    cpus: 2
    stop_grace_period: 40s
    tmpfs: ["/tmp:size=128m,mode=1777,noexec,nosuid,nodev"]
    env_file: ["${FIX_CREDENTIAL_ENV_FILE:?provide an operator-owned FIX credential file mapping}"]
    environment:
      APP_ENV: production
      HTTP_ADDR: ":8080"
      OPERATIONS_ADDR: ":9080"
      REQUIRE_HTTPS: "true"
      # Broker access is restricted to the VPN; TLS and Bearer auth stay required.
      HMAC_REQUIRED: ${HMAC_REQUIRED:-false}
      DOCS_PUBLIC: "false"
      ALLOW_INSECURE_DB: "false"
      ALLOW_INSECURE_HTTP: "false"
      DATABASE_URL_FILE: /run/secrets/database-url
      JWT_SECRET_FILE: /run/secrets/jwt-secret
      API_TOKEN_PEPPER_FILE: /run/secrets/api-token-pepper
      ADMIN_PASSWORD_FILE: /run/secrets/admin-password
      ADMIN_EMAIL: ${ADMIN_EMAIL:?provide the real administrator email}
      CORS_ORIGINS: ${PUBLIC_ORIGIN:?provide the HTTPS origin}
      TRUSTED_PROXIES: ${EDGE_IPV4:-10.89.0.10}/32
      FIX_SESSION_DIR: /app/fix-sessions
      # Production QUIK endpoint; test hosts from historical DB seeds are overridden.
      ADAPTER_HOST_OVERRIDE: ${QUIK_FIX_HOST:-172.23.10.84}
      EXECUTION_INBOX_DIR: /app/fix-sessions/inbox
      EXPORT_DIR: /app/fix-sessions/exports
      BACKUP_STATUS_FILE: /run/backup/last-success
      FIX_TRANSPORT_CONFIG_FILE: /run/fix/transport.json
      GRPC_ADDR: ":8443"
      GRPC_TLS_CERT: /run/pki/server.crt
      GRPC_TLS_KEY: /run/pki/server.key
      GRPC_TLS_CA: /run/pki/ca.crt
      GRPC_MTLS_REQUIRED: ${GRPC_MTLS_REQUIRED:-false}
      GRPC_CLIENT_CERT: ${GRPC_CLIENT_CERT:-}
      GRPC_CLIENT_KEY: ${GRPC_CLIENT_KEY:-}
      GRPC_TARGET: localhost:8443
      GRPC_SERVER_NAME: ${GRPC_SERVER_NAME:?provide certificate DNS identity}
      PROMETHEUS_URL: http://prometheus:9090
      QUIK_API_BASE_URL: ${QUIK_API_BASE_URL:-http://172.23.10.84:5000}
      OBS_FIX_RAW_LOGS: "false"
      OBS_SKIP_ORIGINS: ""
      WORKER_ID: gateway-production-1
    volumes:
      - fix-state:/app/fix-sessions
      - ${BACKUP_STORAGE_DIR:?provide persistent off-host replicated backup directory}:/run/backup:ro
      - ${GATEWAY_SECRETS_DIR:?provide private secret directory}:/run/secrets:ro
      - ${GATEWAY_PKI_DIR:?provide operator PKI directory}:/run/pki:ro
      - ${FIX_CONFIG_DIR:?provide dictionary, TLS and UAT configuration directory}:/run/fix:ro
    ports:
      - "${GRPC_BIND_IP:-127.0.0.1}:${GRPC_PORT:-8443}:8443"
    expose: [8080, 9080]
    networks: [backend]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: &bounded-logs
      driver: json-file
      options: {max-size: "20m", max-file: "5"}

  frontend:
    build:
      context: ../frontend
      args: {VITE_API_URL: "", VITE_DOCS_PUBLIC: "false"}
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 256m
    cpus: 1
    tmpfs: ["/tmp:size=64m,mode=1777,noexec,nosuid,nodev"]
    volumes:
      - ./production/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${EDGE_TLS_DIR:?provide HTTPS certificate and key directory}:/run/tls:ro
    ports:
      - "${HTTPS_BIND_IP:-127.0.0.1}:${HTTPS_PORT:-443}:8443"
    depends_on: {gateway: {condition: service_healthy}}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 3s
      retries: 5
    networks:
      backend: {ipv4_address: "${EDGE_IPV4:-10.89.0.10}"}
    logging: *bounded-logs

  prometheus:
    image: prom/prometheus:v3.13.4@sha256:87861b8cf91579109319ebc300f3f1060e6da9c05d6ae8ad15a20c879e84e32e
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 512m
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus", "--storage.tsdb.retention.time=15d", "--storage.tsdb.retention.size=5GB"]
    volumes:
      - ./production/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rate-limits.rules.yml:/etc/prometheus/rate-limits.rules.yml:ro
      - ./production/gateway.rules.yml:/etc/prometheus/gateway.rules.yml:ro
      - ./prometheus/trades.rules.yml:/etc/prometheus/trades.rules.yml:ro
      - prometheus-data:/prometheus
    networks: [backend]
    logging: *bounded-logs

  alertmanager:
    image: prom/alertmanager:v0.34.1@sha256:e9733bafb1bdef9b00e25a21f8f99dc26a22224bf16641ad754d1649f4c3357a
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 256m
    command: ["--config.file=/etc/alertmanager/alertmanager.yml", "--storage.path=/alertmanager", "--cluster.listen-address="]
    volumes:
      - ${ALERTMANAGER_CONFIG_FILE:?provide real alert delivery configuration}:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    networks: [backend]
    logging: *bounded-logs

  backup:
    build:
      context: ./production
      dockerfile: backup.Dockerfile
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 256m
    environment:
      DATABASE_URL_FILE: /run/secrets/database-url
      BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:?provide the age public encryption recipient}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-3600}
    volumes:
      - ${GATEWAY_SECRETS_DIR:?provide private secret directory}/database-url:/run/secrets/database-url:ro
      - ${GATEWAY_PKI_DIR:?provide operator PKI directory}/database-ca.crt:/run/pki/database-ca.crt:ro
      - ${BACKUP_STORAGE_DIR:?provide persistent off-host replicated backup directory}:/backups
      - fix-state:/state:ro
    tmpfs: ["/tmp:size=32m,mode=1777,noexec,nosuid,nodev"]
    networks: [backend]
    healthcheck:
      test: ["CMD", "/bin/sh", "/app/backup-health.sh"]
      interval: 1m
      timeout: 5s
      retries: 1
      start_period: 2m
    logging: *bounded-logs

networks:
  backend:
    ipam:
      config: [{subnet: "${GATEWAY_SUBNET:-10.89.0.0/24}"}]
volumes:
  fix-state:
  prometheus-data:
  alertmanager-data:
