global:
  scrape_interval: 15s
rule_files:
  - /etc/prometheus/rate-limits.rules.yml
  - /etc/prometheus/gateway.rules.yml
alerting:
  alertmanagers:
    - static_configs: [{targets: ["alertmanager:9093"]}]
scrape_configs:
  - job_name: fix-gateway
    static_configs: [{targets: ["gateway:9080"]}]
  - job_name: alertmanager
    static_configs: [{targets: ["alertmanager:9093"]}]
