server {
  listen 8080;
  location = /health { access_log off; return 200 'ok'; }
  location / { return 404; }
}
server {
  listen 8443 ssl;
  ssl_certificate /run/tls/tls.crt;
  ssl_certificate_key /run/tls/tls.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_tickets off;
  root /usr/share/nginx/html;
  index index.html;
  resolver 127.0.0.11 valid=5s ipv6=off;
  set $gateway gateway:8080;
  client_max_body_size 1m;
  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self';" always;
  location = /metrics { return 404; }
  location = /ready { return 404; }
  location = /health { return 404; }
  location ~ ^/(swagger|broker-swagger|docs)(/|$) { return 404; }
  location /api/ {
    proxy_pass http://$gateway$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 60s;
  }
  location / { try_files $uri /index.html; }
}
