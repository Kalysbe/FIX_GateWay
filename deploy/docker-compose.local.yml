name: fix-gateway-local

# Standalone simulator stack. Do not merge this with the UAT Compose file.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: local-simulator-only
      POSTGRES_DB: fix_gateway_local
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway -d fix_gateway_local"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    image: migrate/migrate:v4.19.1
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../backend/migrations:/migrations:ro
    command: ["-path", "/migrations", "-database", "postgres://gateway:local-simulator-only@postgres:5432/fix_gateway_local?sslmode=disable", "up"]

  bootstrap:
    image: postgres:16-alpine
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      PGPASSWORD: local-simulator-only
    volumes:
      - ./local-simulator.sql:/bootstrap.sql:ro
    command: ["psql", "-h", "postgres", "-U", "gateway", "-d", "fix_gateway_local", "-v", "ON_ERROR_STOP=1", "-f", "/bootstrap.sql"]

  devcerts:
    build:
      context: ../backend
      target: devcerts
    command: ["-out", "/certs"]
    volumes:
      - grpc-certs:/certs

  fixsimulator:
    build:
      context: ../backend
      target: fixsimulator
    restart: unless-stopped
    environment:
      SIM_FILL_DELAY: 3s

  gateway:
    build:
      context: ../backend
      target: gateway
    restart: unless-stopped
    depends_on:
      bootstrap:
        condition: service_completed_successfully
      devcerts:
        condition: service_completed_successfully
      fixsimulator:
        condition: service_started
    environment:
      DATABASE_URL: postgres://gateway:local-simulator-only@postgres:5432/fix_gateway_local?sslmode=disable
      APP_ENV: development
      JWT_SECRET: local-simulator-jwt-secret-development-only
      API_TOKEN_PEPPER: local-simulator-token-pepper-development-only
      ADMIN_EMAIL: admin@localhost
      ADMIN_PASSWORD: admin123
      HTTP_ADDR: ":8080"
      PROMETHEUS_URL: http://prometheus:9090
      GRPC_ADDR: ":8443"
      GRPC_TLS_CERT: /certs/server.crt
      GRPC_TLS_KEY: /certs/server.key
      GRPC_TLS_CA: /certs/ca.crt
      GRPC_MTLS_REQUIRED: "true"
      GRPC_CLIENT_CERT: /certs/bridge.crt
      GRPC_CLIENT_KEY: /certs/bridge.key
      GRPC_TARGET: localhost:8443
      GRPC_SERVER_NAME: localhost
      MIGRATIONS_PATH: /app/migrations
      FIX_SESSION_DIR: /app/fix-sessions
      ADAPTER_HOST_OVERRIDE: fixsimulator
      QUIK_API_BASE_URL: http://127.0.0.1:1
      POSITION_SYNC_INTERVAL: "0s"
      MARKET_DATA_SYNC_INTERVAL: "0s"
      CORS_ORIGINS: http://localhost:25173,http://localhost:25174,http://127.0.0.1:25173,http://127.0.0.1:25174
    volumes:
      - grpc-certs:/certs:ro
      - fix-sessions:/app/fix-sessions
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ready || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 15s

  prometheus:
    image: prom/prometheus:v2.54.1
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rate-limits.rules.yml:/etc/prometheus/rate-limits.rules.yml:ro
      - prometheus-data:/prometheus

  frontend:
    networks: [default, access]
    build:
      context: ../frontend
      args:
        VITE_API_URL: ""
    depends_on:
      gateway:
        condition: service_healthy
    ports:
      - "127.0.0.1:25173:80"

  broker-app:
    networks: [default, access]
    build:
      context: ..
      dockerfile_inline: |
        FROM node:22-alpine AS build
        WORKDIR /app
        COPY broker-app/package.json broker-app/package-lock.json ./
        RUN npm ci
        COPY broker-app/ ./
        RUN npm run build
        FROM nginx:1.27-alpine
        COPY frontend/nginx.conf /etc/nginx/conf.d/default.conf
        COPY --from=build /app/dist /usr/share/nginx/html
    depends_on:
      gateway:
        condition: service_healthy
    ports:
      - "127.0.0.1:25174:80"

  # Docker suppresses host publishing on internal-only networks. This fixed
  # TCP bridge exposes loopback ports without giving gateway an egress route.
  access:
    image: nginx:1.27-alpine
    networks: [default, access]
    depends_on:
      gateway:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        cat > /etc/nginx/nginx.conf <<'CONF'
        events {}
        stream {
          resolver 127.0.0.11 valid=1s ipv6=off;
          server { listen 8080; set $$target gateway:8080; proxy_pass $$target; }
          server { listen 8443; set $$target gateway:8443; proxy_pass $$target; }
          server { listen 5432; set $$target postgres:5432; proxy_pass $$target; }
        }
        CONF
        exec nginx -g 'daemon off;'
    ports:
      - "127.0.0.1:28080:8080"
      - "127.0.0.1:28443:8443"
      - "127.0.0.1:25432:5432"

networks:
  default:
    internal: true
  access:

volumes:
  fix-sessions:
  prometheus-data:
  pgdata:
  grpc-certs:
