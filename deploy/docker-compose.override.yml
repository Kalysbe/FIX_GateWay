# Сервер FIX_GateWay 172.23.10.96: FIX и БД QUIK на .84 (сделки читаются из БД QUIK).
services:
  postgres:
    # Наружу не публикуем: gateway ходит к базе внутри compose-сети
    ports: !override []

  gateway:
    environment:
      ADAPTER_HOST_OVERRIDE: "172.23.10.84"
    ports: !override
      - "8081:8080"
      - "8443:8443"

  frontend:
    ports: !override
      - "5173:8080"
