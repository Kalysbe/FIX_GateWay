# Локальные порты для сервера 172.23.10.96 (5432 и 8080 заняты стеком auction-quik)
services:
  postgres:
    # Наружу не публикуем: gateway ходит к базе внутри compose-сети
    ports: !override []

  gateway:
    ports: !override
      - "8081:8080"

  frontend:
    ports: !override
      - "5173:80"
